# zizmor (GitHub Actions security linter) config for the hub's self-test gate.
# Consumed by the `zizmor` job in .github/workflows/self-test.yml, which runs
# zizmor as a PR-time gate over this repo's own workflows + composite action.
# zizmor auto-discovers this file at .github/zizmor.yml, but the job passes it
# explicitly via `config:` so the intent is unmissable.
#
# The hub's gate runs at `min-confidence: low` (set in self-test.yml) — stricter
# than the fleet callers' default `medium`. The medium floor existed to drop the
# low-confidence `artipacked` (checkout persist-credentials) nags; those are gone
# (t-2nh8): every hub checkout now either sets `persist-credentials: false` or
# declares an intentional, commented `persist-credentials: true` (update-tap's tap
# push, the expiry reminder's tracker push), which artipacked does not report.
# Running at low keeps artipacked permanently gated on NEW checkouts. Trade-off:
# any other low-confidence finding gates too — waive a genuine false positive
# inline with `# zizmor: ignore[rule]` rather than re-raising the floor. Fleet
# callers stay at medium until the fleet is re-audited clean at low.

rules:
  unpinned-uses:
    # zizmor's blanket policy demands a full-length commit SHA for EVERY `uses:`.
    # The hub deliberately pins first-party and self-owned refs to version TAGS
    # instead, so scope the policy to match that convention rather than fail the
    # whole tree on it. NOTE: zizmor's `ref-pin` only requires *some* git ref, so it
    # accepts a branch ref (e.g. @main) as well as a tag — it enforces "not floating
    # / not a bare action", not "tag-only" (zizmor has no tag-only style). The
    # tag-only convention still rides on review; the current tree uses tags.
    config:
      policies:
        # First-party GitHub actions (actions/checkout@v7, actions/cache@v6, …) are
        # pinned to major-version tags, not SHAs — a settled decision, not an
        # oversight: see docs/action-pinning-policy.md for the rationale (GitHub-
        # authored + Dependabot grouped bumps make a tag pin the right trade). A full
        # SHA stays *accepted* here (ref-pin allows it), just never *required*.
        actions/*: ref-pin
        # Our own reusables/actions are pinned to release tags (@v1, @v0.6.0) of
        # repos we control and actively roll — a SHA pin would fight the tag flow.
        akira-toriyama/*: ref-pin
        # Everything third-party MUST be a full-length commit SHA (maxim-lobanov/
        # setup-xcode, taiki-e/install-action, zizmorcore/zizmor-action already are).
        "*": hash-pin

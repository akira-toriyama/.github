# Hub's own task-status caller. fleet-sync EXCLUDEs `.github` (it IS the hub), so
# the canonical `fleet/task-status.yml` is never synced here — this copy is
# maintained BY HAND. Keep the caller body below (the furrow pin,
# on/permissions/secrets) identical to fleet/task-status.yml; only this provenance
# header differs. It lets `SetStatus-task:` PR footers on .github PRs drive the
# furrow tracker (akira-toriyama/projects) like every other repo.
# PROJECTS_WRITE_PAT already exists on this repo, so it activates on merge.
name: task-status

on:
  pull_request:
    # `edited` re-runs the sync when the PR body changes, so a fixed SetStatus
    # footer re-evaluates without close→reopen (t-rb4c; needs the reusable at
    # >= v0.13.0 — older gates map edited to skip, harmlessly).
    types: [opened, edited, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    # Pin a CONCRETE furrow release tag: the workflow installs the furrow
    # release binary of the same version (skew-free); bump the pin per release.
    uses: akira-toriyama/furrow/.github/workflows/sync-task-status.yml@v0.14.0
    # Pass ONLY the tracker-write PAT — least privilege over `secrets: inherit`,
    # which would expose every caller-repo secret to the reusable workflow.
    secrets:
      PROJECTS_WRITE_PAT: ${{ secrets.PROJECTS_WRITE_PAT }}

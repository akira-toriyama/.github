name: update-tap

# Reusable Homebrew-tap bumper, called by each app repo's thin caller
# workflow. When the caller publishes a Release (or is manually
# dispatched), this bumps the formula at akira-toriyama/homebrew-tap to
# that tag + the fresh source-tarball sha256. Idempotent — re-running on
# the same tag is a no-op when the formula already matches.
#
# The logic lived byte-near-identical in facet / halo / perch / wand; it now
# lives here once and they only `uses:` this file. chord and glance converged
# here too; jig was removed; eventfx keeps its own custom bumper (its release
# is effectively dormant, so migrating buys nothing — see the decision record).
# See docs/release-tap-unification.md.
# This reusable is the BEST common form: pull-rebase retry, a 5-min timeout,
# repo-qualified first-match seds and a no-downgrade guard are baked in for
# everyone; the only knobs are the formula name and an explicit rollback opt-in.
#
# Cross-repo write needs a PAT (GITHUB_TOKEN can only touch the caller
# repo). Add a fine-grained PAT with `Contents: Read & write` scoped to
# homebrew-tap, as the caller repo secret `HOMEBREW_TAP_TOKEN`.
#
# Caller skeleton (.github/workflows/update-tap.yml in each app repo):
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#       inputs:
#         tag:
#           description: "Tag to bump (e.g. v1.4.0). Empty → latest published."
#           required: false
#           default: ""
#   jobs:
#     bump:
#       uses: akira-toriyama/.github/.github/workflows/update-tap.yml@v1
#       with:
#         formula: facet
#         tag: ${{ github.event.inputs.tag || '' }}
#       secrets:
#         HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

on:
  workflow_call:
    inputs:
      formula:
        description: "Formula basename in homebrew-tap (e.g. 'facet' → Formula/facet.rb)."
        required: true
        type: string
      tag:
        description: "Explicit tag to bump (e.g. v1.4.0). Empty → release event's tag, else latest published."
        required: false
        type: string
        default: ""
      allow-downgrade:
        description: "Permit bumping the formula BACKWARD (e.g. rolling back a bad release). Default false — a backward move is refused."
        required: false
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: "Fine-grained PAT with Contents: Read & write on homebrew-tap."
        required: true

# Serializes bump runs WITHIN one caller repo (a called workflow's top-level
# concurrency is enforced on the caller's run, and concurrency groups are
# repo-scoped): rapid same-repo releases apply in order instead of racing —
# without this, an older run pushing last would roll the formula BACK. It
# cannot serialize two DIFFERENT repos (facet vs halo) targeting the shared
# tap; that cross-repo race is handled by the push rebase-retry below.
concurrency:
  group: update-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # Bounded so a stuck `git push` against the tap repo can't hang
    # forever — the whole job is a few short network ops.
    timeout-minutes: 5
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          # Event data goes through env, never inline ${{ }} in run: a tag name
          # can legally contain shell metacharacters ($, ;, …).
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            t="${INPUT_TAG}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            t="${RELEASE_TAG}"
          else
            t="$(gh release view --repo "${{ github.repository }}" \
                  --json tagName --jq .tagName)"
          fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "::notice::Target tag = $t"

      - name: Download source tarball + compute sha256
        id: sha
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o src.tgz "$url"
          s="$(sha256sum src.tgz | awk '{print $1}')"
          echo "sha=$s" >> "$GITHUB_OUTPUT"
          echo "::notice::sha256 = $s"

      - name: Checkout homebrew-tap (PAT)
        uses: actions/checkout@v7
        with:
          repository: akira-toriyama/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          # The bump step's pull-rebase-push retry loop runs plain git against
          # this checkout, so the PAT must stay configured — explicit true marks
          # the persistence as intentional (zizmor artipacked stays silent on an
          # explicit opt-in). checkout v6+ keeps the credential under
          # $RUNNER_TEMP, outside the workdir, and this job uploads no
          # artifacts. t-2nh8
          persist-credentials: true

      # The pure formula-mutation half lives in the bump-formula composite so
      # self-test can table-test it (t-kve5). It mutates the checked-out
      # tap/Formula/<name>.rb in place; the git commit/push half stays below,
      # where the fake-tap fixture a runtime smoke would need is out of scope.
      - name: Bump Formula (mutate)
        uses: akira-toriyama/.github/actions/bump-formula@v1
        with:
          formula-path: tap/Formula/${{ inputs.formula }}.rb
          tag: ${{ steps.tag.outputs.tag }}
          sha: ${{ steps.sha.outputs.sha }}
          repo: ${{ github.repository }}
          formula: ${{ inputs.formula }}
          allow-downgrade: ${{ inputs.allow-downgrade }}

      - name: Commit + push tap (only if changed)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NEW_SHA: ${{ steps.sha.outputs.sha }}
          FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          cd tap
          # bump-formula leaves the file untouched on a no-op (already at TAG), so
          # git is the single authority on "did anything change" — the mutate step
          # no longer commits. Nothing to commit → nothing to push.
          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "::notice::${FORMULA} tap already at ${TAG} — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git commit -m "homebrew: bump ${FORMULA} to ${TAG}"
          # Pull-rebase + push with retry: a concurrent tap writer (two app repos
          # releasing at once — the concurrency group above is repo-scoped, so it
          # only serializes runs within one repo) or a manual tap edit makes a
          # plain push non-fast-forward, leaving the release published but the
          # tap stale. On a rebase conflict, abort cleanly and fail loudly rather
          # than leaving the tap mid-rebase; after 3 rejected pushes, fail loud —
          # never fall through green unpushed.
          pushed=0
          for i in 1 2 3; do
            if ! git pull --rebase; then
              git rebase --abort 2>/dev/null || true
              echo "::error::tap rebase hit a conflict — aborted; ${FORMULA} not bumped to ${TAG}. Resolve the tap and re-run."
              exit 1
            fi
            if git push; then pushed=1; break; fi
            echo "push rejected (race); retrying (attempt $i)"
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::tap push failed after 3 attempts; ${FORMULA} not bumped to ${TAG}. Re-run this workflow."
            exit 1
          fi
          echo "::notice::Bumped tap to ${TAG} (sha ${NEW_SHA:0:12}…)."

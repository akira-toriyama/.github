# Fleet audit: every repo must run ONE glyph version.
#
# Why this exists. glyph is shared infrastructure — the commit lint, the semver
# verdict and the release notes for every repo come out of one binary — so a repo
# left on an old pin silently enforces different rules from its neighbours. That
# is not hypothetical: on 2026-07-20 the fleet was found split across v0.8.0 and
# v0.8.1 with nobody aware, and dotfiles was installing a v0.8.1 BINARY while its
# workflows were pinned to v0.10.0. Both were found by hand, which is exactly the
# thing that must not be the detection mechanism.
#
# What it checks. The canonical pin is whatever fleet/commit-lint.yml declares —
# that file is what fleet-sync distributes, so it IS the fleet's intended version.
# Every reference to akira-toriyama/glyph in every owned repo must carry that same
# tag. All three drift independently:
#
#   - reusable workflows  (.github/workflows/*.yml@vX.Y.Z)
#   - the install action  (.github/actions/install@vX.Y.Z)
#   - the BINARY that action installs (`with: version:`)   <- invisible until 2026-07-22
#
# The third one is why this file grew a parser. `uses:` is line-local and was a
# grep for months; `version:` is a generic input name, so what makes an occurrence
# a glyph pin is the STEP it sits in. Nothing looked at it, and seven repos sat on
# a v0.8.0 binary behind a v0.10.2 action — enforcing a three-release-old
# convention while every audit and every workflow file said otherwise. Reading
# blocks lives in scripts/glyph-pin-scan.sh, table-tested by
# tests/glyph-pin-scan.test.sh, because a parser nobody can run is a parser
# nobody can trust.
#
# Before any repo is read, the canonical itself is audited both ways: the tag it
# pins must EXIST in akira-toriyama/glyph (a pin ahead of its tag kills every
# caller's run with zero jobs and zero check-runs — invisible to gh pr checks and
# required checks; t-c51t), and it must BE the latest glyph release (every check
# below derives its expected value from the canonical, so a fleet uniformly one
# release behind used to be all green; t-2268).
#
# COMMENTS ARE IGNORED. Every glyph reusable carries a commented caller stub
# showing an example pin, and those examples are always stale. Matching them
# produces permanent false drift, so only real `uses:` lines are read. (Finding
# this the hard way is why the check is written as a workflow and not a grep in
# someone's notes.)
#
# THE AUDITOR MUST SEE WHAT THE WRITER WRITES. This ran on the default
# GITHUB_TOKEN for its first week, and that token cannot list other repos'
# private copies: on 2026-07-28 this audit logged `auditing 29 repos` while
# fleet-sync — writing with FLEET_SYNC_PAT — logged `candidate repos: 35`. The
# six private repos were outside the audit's view, so "fleet is level" was a
# claim about 29 of 35, and nobody noticed because no single place showed both
# numbers. Hence: the SAME credential as fleet-sync, a hard failure when it is
# absent (a public-only audit is worse than a red one), and a private-repo
# canary below proving the wider view is actually in effect — a count kept in
# prose would rot, so the guard asserts the SHAPE of the list, not its size.
#
# Failure is the point: this reports via exit status, so the scheduled run turns
# red and stays red until the fleet is level again. Bump a pin by editing
# fleet/commit-lint.yml + fleet/version-preview.yml AND the hub's own
# hand-maintained .github/workflows/self-commit-lint.yml (fleet-sync EXCLUDEs the
# hub, so nothing syncs that one — and this audit scans .github like any other
# repo, so leaving it behind turns the audit red; tests/fleet-manifest.test.sh now
# fails first). Then run fleet-sync, and open per-repo PRs for the install action,
# the version it installs, and any release.yml caller — those are NOT
# fleet-managed.

name: glyph-pin-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *' # daily, after fleet-sync (06:00) has had time to land
  push:
    branches: [main]
    paths:
      - 'fleet/commit-lint.yml'
      - 'fleet/version-preview.yml'
      - '.github/workflows/glyph-pin-audit.yml'
      # The extractor IS the audit's eyesight — a change to it must re-run.
      - 'scripts/glyph-pin-scan.sh'

concurrency:
  group: glyph-pin-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Audit every repo's glyph pins against the canonical
        env:
          # fleet-sync's writing credential, NOT github.token — the default
          # token sees no private repos, and an audit over a subset reports
          # "fleet is level" about a fleet it cannot see (see header).
          GH_TOKEN: ${{ secrets.FLEET_SYNC_PAT }}
          OWNER: akira-toriyama
        run: |
          set -euo pipefail

          # Fail loud, not open: without the PAT this audit would still run,
          # see only public repos, and hand out a green that claims less than
          # it appears to. Dormancy (fleet-sync's gate) is wrong here — a
          # degraded auditor must be RED, because its green is a false claim.
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::FLEET_SYNC_PAT is not set — refusing to audit with a public-only view (it would silently exclude every private repo)."; exit 1; }

          # The canonical pin: what fleet-sync hands to every repo. Read through
          # the SAME extractor as every repo below — one reader, one truth, and
          # the canonical is covered by the extractor's own table test.
          want="$(bash scripts/glyph-pin-scan.sh < fleet/commit-lint.yml \
                  | awk -F'\t' '$1 == "uses" { print $2; exit }')"
          [ -n "$want" ] || { echo "::error::could not read the canonical glyph pin from fleet/commit-lint.yml"; exit 1; }
          echo "canonical glyph pin: $want"

          # The tag must EXIST. A pin bumped ahead of its tag does not fail
          # visibly — every caller's run dies with zero jobs and therefore zero
          # check-runs, invisible to gh pr checks, statusCheckRollup and
          # required checks alike (furrow runs 30187876943 / 30187821262 are
          # that shape; t-c51t). Only a 404 proves absence; any other failure
          # is an unverified claim and fails as itself.
          ref_err="$RUNNER_TEMP/tag-ref.err"
          if ! gh api "repos/$OWNER/glyph/git/ref/tags/$want" --jq .ref >/dev/null 2>"$ref_err"; then
            if grep -qE 'HTTP 404' "$ref_err"; then
              echo "::error::fleet/commit-lint.yml pins glyph $want but that tag does not exist — every caller's run would die with zero jobs and NO check-run (invisible to gh pr checks and required checks)."
            else
              echo "::error::cannot verify that glyph tag $want exists — the canonical has not been audited: $(head -c 200 "$ref_err")"
            fi
            exit 1
          fi

          # The canonical must BE the current release. Every check below derives
          # its expected value from the canonical itself, so a fleet uniformly
          # one release behind is all green unless upstream is asked (t-2268 —
          # the furrow pin sat reverted for ~46h with nothing red anywhere).
          # Red here means "a release exists that no rollout has started";
          # during a rollout the canonical has already moved, so a ledger soak
          # does not trip this.
          latest="$(gh release view -R "$OWNER/glyph" --json tagName --jq .tagName)" \
            || { echo "::error::cannot read the latest glyph release — the canonical's currency has not been audited."; exit 1; }
          if [ "$want" != "$latest" ]; then
            echo "::error::fleet/commit-lint.yml pins glyph $want but the latest glyph release is $latest — the fleet is uniformly enforcing an old release. Start the rollout (docs/glyph-rollout-runbook.md)."
            exit 1
          fi
          echo "canonical is current: $want == latest release"

          repo_rows="$(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork,visibility -q '.[] | select(.isFork==false) | .name + "\t" + .visibility' | sort)"
          mapfile -t REPOS < <(printf '%s\n' "$repo_rows" | cut -f1)
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::empty repo list from gh repo list — aborting (transient API failure?)."; exit 1; }

          # The private-repo canary. The failure mode this audit acquired on
          # 2026-07-28 was not an error but a silently NARROWER list — six
          # private repos gone with nothing red anywhere. A hand-kept expected
          # count would rot (fleet-sync refuses one for the same reason), but
          # the SHAPE is stable: this fleet always contains private repos, and
          # every credential that can see zero of them is the degraded one.
          private_n="$(printf '%s\n' "$repo_rows" | grep -c $'\tPRIVATE' || true)"
          if [ "${private_n:-0}" -eq 0 ]; then
            echo "::error::the repo list contains no private repos — the token's view is degraded (this is how the 29-of-35 audit happened), refusing to call this an audit of the fleet."
            exit 1
          fi
          echo "auditing ${#REPOS[@]} repos ($private_n private)"

          # A repo this loop cannot READ is not a repo that PASSED. Both reads
          # below used to be `|| true` + `continue`, so a transient API failure
          # contributed zero drift and the run still ended `fleet is level` —
          # "could not see" and "saw no drift" were indistinguishable (t-a8zh).
          # Absence stays normal: an empty repo answers HTTP 404/409 on the
          # tree, and that is genuinely nothing to audit; every OTHER failure
          # is counted and fails the run at the end, next to drift.
          drift=0
          apifail=0
          for repo in "${REPOS[@]}"; do
            full="$OWNER/$repo"
            # glyph is audited like every other repo. It reaches its own composite
            # by relative path (`./.glyph-action/…`), which never matches, and the
            # commented caller stubs its reusables ship are skipped as comments by
            # the extractor — so the pins left to see are the ones fleet-sync gave
            # it, which is exactly what should be checked. (A comment here used to
            # claim glyph was excluded; no code ever excluded it.)
            tree_err="$RUNNER_TEMP/audit-tree.err"
            if ! tree="$(gh api "repos/$full/git/trees/HEAD?recursive=1" --jq \
              '.tree[] | select(.path | startswith(".github/")) | select(.path | test("\\.ya?ml$")) | .path' 2>"$tree_err")"; then
              if grep -qE 'HTTP (404|409)' "$tree_err"; then continue; fi # empty repo / no default branch — nothing to audit
              echo "::error::cannot list the tree of $full — this repo was NOT audited: $(head -c 200 "$tree_err")"
              apifail=$((apifail + 1))
              continue
            fi
            [ -n "$tree" ] || continue # no .github/**.yml — nothing to audit

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              body_err="$RUNNER_TEMP/audit-body.err"
              if ! raw="$(gh api "repos/$full/contents/$path" --jq '.content' 2>"$body_err")"; then
                echo "::error::cannot read $full $path — this file was NOT audited: $(head -c 200 "$body_err")"
                apifail=$((apifail + 1))
                continue
              fi
              if ! body="$(printf '%s\n' "$raw" | base64 -d 2>/dev/null)"; then
                echo "::error::cannot decode $full $path — this file was NOT audited"
                apifail=$((apifail + 1))
                continue
              fi
              [ -n "$body" ] || continue # an empty file carries no pin
              while IFS="$(printf '\t')" read -r kind ref line; do
                [ -n "$kind" ] || continue
                case "$kind" in
                  uses)
                    if [ "$ref" != "$want" ]; then
                      echo "::error::$full $path:$line pins glyph $ref — canonical is $want"
                      drift=$((drift + 1))
                    fi
                    ;;
                  uses-unpinned)
                    # A branch, a SHA, a moving major or a prerelease. Whatever it
                    # resolves to today it can resolve to something else tomorrow,
                    # so it is drift even when it currently points at $want.
                    echo "::error::$full $path:$line references glyph at '$ref', which is not a concrete release tag — canonical is $want"
                    drift=$((drift + 1))
                    ;;
                  version)
                    # The workflow file can be entirely current and this still
                    # wrong; that combination is why the check exists.
                    if [ "$ref" != "$want" ]; then
                      echo "::error::$full $path:$line installs the glyph $ref BINARY — canonical is $want"
                      drift=$((drift + 1))
                    fi
                    ;;
                  version-missing)
                    echo "::error::$full $path:$line pins actions/install@$ref but passes no version: — the input is required, so this step cannot run"
                    drift=$((drift + 1))
                    ;;
                  version-unreadable)
                    echo "::error::$full $path:$line pins actions/install@$ref and computes its version: — this audit cannot tell which binary it installs. Pass a literal tag."
                    drift=$((drift + 1))
                    ;;
                esac
              done < <(printf '%s\n' "$body" | bash scripts/glyph-pin-scan.sh)
            done <<< "$tree"
          done

          if [ "$drift" -gt 0 ] || [ "$apifail" -gt 0 ]; then
            echo "::error::glyph pin audit failed: $drift reference(s) off $want, $apifail read failure(s) — a repo that could not be read has not passed."
            exit 1
          fi
          echo "fleet is level on glyph $want"

# Fleet audit: every repo must run ONE glyph version.
#
# Why this exists. glyph is shared infrastructure — the commit lint, the semver
# verdict and the release notes for every repo come out of one binary — so a repo
# left on an old pin silently enforces different rules from its neighbours. That
# is not hypothetical: on 2026-07-20 the fleet was found split across v0.8.0 and
# v0.8.1 with nobody aware, and dotfiles was installing a v0.8.1 BINARY while its
# workflows were pinned to v0.10.0. Both were found by hand, which is exactly the
# thing that must not be the detection mechanism.
#
# What it checks. The canonical pin is whatever fleet/commit-lint.yml declares —
# that file is what fleet-sync distributes, so it IS the fleet's intended version.
# Every reference to akira-toriyama/glyph in every owned repo must carry that same
# tag. All three drift independently:
#
#   - reusable workflows  (.github/workflows/*.yml@vX.Y.Z)
#   - the install action  (.github/actions/install@vX.Y.Z)
#   - the BINARY that action installs (`with: version:`)   <- invisible until 2026-07-22
#
# The third one is why this file grew a parser. `uses:` is line-local and was a
# grep for months; `version:` is a generic input name, so what makes an occurrence
# a glyph pin is the STEP it sits in. Nothing looked at it, and seven repos sat on
# a v0.8.0 binary behind a v0.10.2 action — enforcing a three-release-old
# convention while every audit and every workflow file said otherwise. Reading
# blocks lives in scripts/glyph-pin-scan.sh, table-tested by
# tests/glyph-pin-scan.test.sh, because a parser nobody can run is a parser
# nobody can trust.
#
# COMMENTS ARE IGNORED. Every glyph reusable carries a commented caller stub
# showing an example pin, and those examples are always stale. Matching them
# produces permanent false drift, so only real `uses:` lines are read. (Finding
# this the hard way is why the check is written as a workflow and not a grep in
# someone's notes.)
#
# Failure is the point: this reports via exit status, so the scheduled run turns
# red and stays red until the fleet is level again. Bump a pin by editing
# fleet/commit-lint.yml + fleet/version-preview.yml AND the hub's own
# hand-maintained .github/workflows/self-commit-lint.yml (fleet-sync EXCLUDEs the
# hub, so nothing syncs that one — and this audit scans .github like any other
# repo, so leaving it behind turns the audit red; tests/fleet-manifest.test.sh now
# fails first). Then run fleet-sync, and open per-repo PRs for the install action,
# the version it installs, and any release.yml caller — those are NOT
# fleet-managed.

name: glyph-pin-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *' # daily, after fleet-sync (06:00) has had time to land
  push:
    branches: [main]
    paths:
      - 'fleet/commit-lint.yml'
      - 'fleet/version-preview.yml'
      - '.github/workflows/glyph-pin-audit.yml'
      # The extractor IS the audit's eyesight — a change to it must re-run.
      - 'scripts/glyph-pin-scan.sh'

concurrency:
  group: glyph-pin-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Audit every repo's glyph pins against the canonical
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: akira-toriyama
        run: |
          set -euo pipefail

          # The canonical pin: what fleet-sync hands to every repo. Read through
          # the SAME extractor as every repo below — one reader, one truth, and
          # the canonical is covered by the extractor's own table test.
          want="$(bash scripts/glyph-pin-scan.sh < fleet/commit-lint.yml \
                  | awk -F'\t' '$1 == "uses" { print $2; exit }')"
          [ -n "$want" ] || { echo "::error::could not read the canonical glyph pin from fleet/commit-lint.yml"; exit 1; }
          echo "canonical glyph pin: $want"

          mapfile -t REPOS < <(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork -q '.[] | select(.isFork==false) | .name' | sort)
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::empty repo list from gh repo list — aborting (transient API failure?)."; exit 1; }
          echo "auditing ${#REPOS[@]} repos"

          drift=0
          for repo in "${REPOS[@]}"; do
            full="$OWNER/$repo"
            # glyph is audited like every other repo. It reaches its own composite
            # by relative path (`./.glyph-action/…`), which never matches, and the
            # commented caller stubs its reusables ship are skipped as comments by
            # the extractor — so the pins left to see are the ones fleet-sync gave
            # it, which is exactly what should be checked. (A comment here used to
            # claim glyph was excluded; no code ever excluded it.)
            tree="$(gh api "repos/$full/git/trees/HEAD?recursive=1" --jq \
              '.tree[] | select(.path | startswith(".github/")) | select(.path | test("\\.ya?ml$")) | .path' 2>/dev/null || true)"
            [ -n "$tree" ] || continue

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              body="$(gh api "repos/$full/contents/$path" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
              [ -n "$body" ] || continue
              while IFS="$(printf '\t')" read -r kind ref line; do
                [ -n "$kind" ] || continue
                case "$kind" in
                  uses)
                    if [ "$ref" != "$want" ]; then
                      echo "::error::$full $path:$line pins glyph $ref — canonical is $want"
                      drift=$((drift + 1))
                    fi
                    ;;
                  uses-unpinned)
                    # A branch, a SHA, a moving major or a prerelease. Whatever it
                    # resolves to today it can resolve to something else tomorrow,
                    # so it is drift even when it currently points at $want.
                    echo "::error::$full $path:$line references glyph at '$ref', which is not a concrete release tag — canonical is $want"
                    drift=$((drift + 1))
                    ;;
                  version)
                    # The workflow file can be entirely current and this still
                    # wrong; that combination is why the check exists.
                    if [ "$ref" != "$want" ]; then
                      echo "::error::$full $path:$line installs the glyph $ref BINARY — canonical is $want"
                      drift=$((drift + 1))
                    fi
                    ;;
                  version-missing)
                    echo "::error::$full $path:$line pins actions/install@$ref but passes no version: — the input is required, so this step cannot run"
                    drift=$((drift + 1))
                    ;;
                  version-unreadable)
                    echo "::error::$full $path:$line pins actions/install@$ref and computes its version: — this audit cannot tell which binary it installs. Pass a literal tag."
                    drift=$((drift + 1))
                    ;;
                esac
              done < <(printf '%s\n' "$body" | bash scripts/glyph-pin-scan.sh)
            done <<< "$tree"
          done

          if [ "$drift" -gt 0 ]; then
            echo "::error::glyph pin drift across the fleet: $drift reference(s) off $want"
            exit 1
          fi
          echo "fleet is level on glyph $want"

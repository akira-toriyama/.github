name: Release

# Reusable rolling-DRAFT release, called by each Swift-app repo's thin
# caller. A push to main (PR merge) makes git-cliff compute the next
# version from Conventional Commits and create/update a single DRAFT
# GitHub Release. No tag is created here — GitHub tags the target commit
# when you manually Publish in the UI. Merge more to main → the
# next-release draft grows; versions don't multiply while unpublished.
# workflow_dispatch + dry_run = full preview (no draft, no version
# consumed). Config: each repo's cliff.toml.
#
# The version-compute + dry-run + rolling-draft bash logic lived
# byte-near-identical in facet / halo / perch / wand (~140 lines × 4);
# it now lives here once and they only `uses:` this file with their app
# name + install prose. (glance is NOT a caller — it ships a bare CLI binary
# rather than an .app, a load-bearing divergence; chord converged onto this
# reusable, jig was removed. See docs/release-tap-unification.md.) BEST common
# form: the SPM cache + a 30-min timeout are baked
# in for everyone (facet/halo gain what perch/wand already had); the
# build is the uniform `package.sh` (it runs `swift build -c release`
# itself), so no per-app build script is passed in — only an optional
# post-build `--validate` smoke (a boolean).
#
# Same-repo release writes use the workflow's own GITHUB_TOKEN
# (contents: write), so no caller secret is needed.
#
# Immutable releases (when enabled on the repo): immutability is conferred at
# Publish, so the rolling DRAFT stays mutable and this flow is unaffected. Two
# safeguards keep it deadlock-free: (1) the next version must be strictly greater
# than the latest PUBLISHED release — a deleted-then-recomputed immutable tag is
# permanently burned and can never be re-Published, so we fail loud instead of
# drafting it; (2) stale-draft cleanup deletes DRAFTS by release id, never by tag
# name, so it can't hit a published release (cli/cli#9367) or burn a tag.
# Discipline: never delete a published release or its tag. See
# docs/immutable-releases-hardening.md.
#
# Caller skeleton (.github/workflows/release.yml in each app repo):
#   on:
#     push: { branches: [main] }
#     workflow_dispatch:
#       inputs:
#         dry_run: { description: "Preview only", type: boolean, default: false }
#   concurrency: { group: release, cancel-in-progress: false }
#   jobs:
#     release:
#       uses: akira-toriyama/.github/.github/workflows/release.yml@v1
#       with:
#         app: Facet              # → Facet.app / Facet.zip, binary `facet`
#         smoke: false            # true → run `<App>/Contents/MacOS/<app> --validate`
#         dry-run: ${{ github.event.inputs.dry_run == 'true' }}
#         install-notes: |
#           ## Install
#           …app-specific markdown appended after the changelog…

on:
  workflow_call:
    inputs:
      app:
        description: "App display name, e.g. 'Facet' → builds Facet.app, attaches Facet.zip, binary `facet`."
        required: true
        type: string
      install-notes:
        description: "Markdown appended to the changelog in the release notes (the per-app `## Install` block)."
        required: true
        type: string
      smoke:
        description: "Run `./<App>.app/Contents/MacOS/<app-lowercased> --validate` after the build (apps that have a --validate)."
        required: false
        type: boolean
        default: false
      smoke-cmd:
        description: "Post-build smoke args, e.g. 'config --validate' — runs `./<App>.app/Contents/MacOS/<app> <smoke-cmd>`. Takes precedence over `smoke` (use for yabai-style `wand config --validate` etc.); empty falls back to `smoke`."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Preview only — no draft, no version consumed (thread the caller's workflow_dispatch input)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # macos-26: family apps on the macOS-26 floor (sill v2.0.0+) ship
    # minos-26 binaries the smoke step must EXECUTE — a macos-15 host can
    # compile them but cannot run them. The newer image's Xcode still
    # builds the remaining floor-13 apps, so every caller is safe.
    runs-on: macos-26
    # Bounded so a hung step (build, signing, gh upload) can't burn the
    # macOS minutes budget. Generous — a cold build + package + upload is
    # well under this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # git-cliff and `git tag --sort` walk the already-fetched history
          # locally; every release write goes through gh + GH_TOKEN env, never
          # git push — drop the persisted checkout token (zizmor artipacked).
          # SwiftPM dependency fetches never used it either (a repo-local
          # credential doesn't apply to .build/repositories clones). t-2nh8
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Same SPM cache as the swift-build action — `package.sh` runs `swift build`
      # underneath, so the warm artefacts help here too. Key matches the action's:
      # the repo name guards against stale PCH module-cache paths after a rename,
      # and Package.resolved is hashed so a dependency bump invalidates the cache
      # (hashFiles tolerates a missing Package.resolved for deps-free repos).
      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ github.event.repository.name }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-${{ github.event.repository.name }}-

      - name: Install git-cliff
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2
        with:
          tool: git-cliff@2

      # Next version via git-cliff directly (official recommendation).
      # Unpublished drafts create no tag, so `last` stays at the last
      # Published version and the computed `next` is stable across merges.
      # This step is I/O only (git-cliff + git tag + gh); the release/deadlock
      # DECISION lives in the next-version-guard composite so self-test can
      # table-test it (t-kve5). The guard's rationale comments live there.
      - name: Compute next version inputs
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="$(git-cliff --config cliff.toml --bumped-version | tr -d '[:space:]')"
          last="$(git tag --sort=-v:refname | head -n1)"
          # Floor on PUBLISHED GitHub releases, not just local git tags: an
          # immutable release's tag can't vanish while the release exists, but
          # this also catches a tag deleted out-of-band (release kept) or any
          # git-cliff/config regression that fails to advance the version.
          # BSD-portable numeric sort (inputs are strict vX.Y.Z) — macos-15's
          # sort has no reliable `-V`.
          pub_latest="$(gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft==false and (.tagName|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tagName' \
            2>/dev/null | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)"
          if [ -n "$pub_latest" ]; then pub_latest="v$pub_latest"; fi
          {
            echo "next=$next"
            echo "last=$last"
            echo "pub_latest=$pub_latest"
          } >> "$GITHUB_OUTPUT"

      # Pure release/deadlock decision, extracted so self-test table-tests it (the
      # class of bug t-fqhx hit — a version regressing below the published floor
      # must deadlock, not draft). Keeps id `ver` so the downstream steps'
      # steps.ver.outputs.release/version references are unchanged.
      - name: Version guard
        id: ver
        uses: akira-toriyama/.github/actions/next-version-guard@v1
        with:
          next: ${{ steps.compute.outputs.next }}
          last: ${{ steps.compute.outputs.last }}
          pub-latest: ${{ steps.compute.outputs.pub_latest }}

      - name: Generate release notes
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          INSTALL_NOTES: ${{ inputs.install-notes }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --unreleased --tag "$VERSION" --strip all > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "Initial release." > RELEASE_NOTES.md
          # Append the caller's install block verbatim (printf %s — no
          # shell expansion of its backticks / $(…)).
          printf '\n%s\n' "$INSTALL_NOTES" >> RELEASE_NOTES.md

      # Build <App>.app via package.sh (ad-hoc signed for CI — the script
      # picks $CODESIGN_ID > .signing-id > "-"; it runs `swift build -c
      # release` itself). Optional --validate smoke for apps that have it.
      - name: Build app + zip
        if: steps.ver.outputs.release == 'true'
        env:
          CODESIGN_ID: "-"
          APP: ${{ inputs.app }}
          SMOKE: ${{ inputs.smoke }}
          SMOKE_CMD: ${{ inputs.smoke-cmd }}
        run: |
          set -euo pipefail
          ./package.sh
          bin="$(echo "$APP" | tr '[:upper:]' '[:lower:]')"
          # `smoke-cmd` (e.g. `config --validate`) takes precedence; else
          # the legacy boolean `smoke` runs `--validate`. Unquoted on
          # purpose so multi-word args split.
          if [ -n "$SMOKE_CMD" ]; then
            # shellcheck disable=SC2086 # intentional word-split (see above)
            "./${APP}.app/Contents/MacOS/${bin}" $SMOKE_CMD
          elif [ "$SMOKE" = "true" ]; then
            "./${APP}.app/Contents/MacOS/${bin}" --validate
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "${APP}.app" "artifacts/${APP}.zip"

      # dry_run (workflow_dispatch only): no draft; upload notes +
      # artifact so you can preview without consuming a version.
      - name: Upload preview (dry run)
        if: steps.ver.outputs.release == 'true' && inputs.dry-run
        uses: actions/upload-artifact@v7
        with:
          name: release-preview-${{ steps.ver.outputs.version }}
          path: |
            artifacts/${{ inputs.app }}.zip
            RELEASE_NOTES.md

      - name: Dry-run summary
        if: steps.ver.outputs.release == 'true' && inputs.dry-run
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## Dry run: ${VERSION} (no draft created)"
            echo
            echo '```'
            cat RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Normal run (push:main, not dry_run): create/update the single rolling
      # DRAFT. No tag is created (GitHub tags the target commit on Publish).
      # Stale auto-drafts of other versions are discarded BY RELEASE ID, never by
      # tag name: gh resolves a draft by its *intended* publish tag, so a
      # tag-name delete can hit a published release that shares that name
      # (cli/cli#9367) — which, under immutable releases, would burn the tag.
      # Published / immutable releases are never touched, and no tags are deleted.
      - name: Create or update rolling DRAFT release
        if: steps.ver.outputs.release == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
          APP: ${{ inputs.app }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Enumerate releases via REST — it exposes the release id (gh release
          # list --json does not). Only unpublished DRAFTS with a semver
          # intended-tag are candidates; published/immutable releases (draft=false)
          # are excluded outright. bash 3.2 safe (no mapfile).
          gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select(.draft==true and (.tag_name|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | [.id, .tag_name] | @tsv' \
            > /tmp/drafts.tsv || true

          # Keep exactly one current-version draft (its id); delete every other
          # auto-draft — and any duplicate current-version drafts — by id, so the
          # subsequent update resolves unambiguously.
          have_current_id=""
          while IFS=$'\t' read -r id tag; do
            [ -z "${id:-}" ] && continue
            if [ "$tag" = "$VERSION" ] && [ -z "$have_current_id" ]; then
              have_current_id="$id"
            else
              echo "::notice::Discarding stale auto-draft $tag (id $id)"
              gh api -X DELETE "repos/$REPO/releases/$id" || true
            fi
          done < /tmp/drafts.tsv

          assets="artifacts/${APP}.zip"
          if [ -n "$have_current_id" ]; then
            gh release upload "$VERSION" "$assets" --clobber
            gh release edit "$VERSION" --draft \
              --title "$VERSION" --notes-file RELEASE_NOTES.md --target "$SHA"
            url="$(gh release view "$VERSION" --json url --jq .url)"
            action="updated"
          else
            url="$(gh release create "$VERSION" --draft --target "$SHA" \
              --title "$VERSION" --notes-file RELEASE_NOTES.md "$assets")"
            action="created"
          fi

          echo "::notice::Draft release ${action} (unpublished, no tag yet). Review & Publish manually: ${url}"
          {
            echo "## Draft release ${VERSION} ${action} (unpublished)"
            echo
            echo "Merging more to main grows this draft. Review and Publish"
            echo "manually (the tag is created at Publish time): ${url}"
          } >> "$GITHUB_STEP_SUMMARY"

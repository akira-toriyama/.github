name: Commit lint

# Reusable gitmoji + Conventional Commits validator, called by each family
# repo's thin caller workflow. Runs in the CALLER repo's context:
# actions/checkout pulls the caller's commits, so the BASE..HEAD range is
# the caller PR's. The logic lives here once (it was byte-identical across
# facet / halo / perch / wand and drifted in chord / glance); callers only
# trigger + `uses:` this file. The convention is documented once in the canonical
# CONTRIBUTING.md (https://github.com/akira-toriyama/.github/blob/main/CONTRIBUTING.md);
# repos also ship a local hook at scripts/hooks/commit-msg.
#
# Caller skeleton (.github/workflows/commit-lint.yml in each repo):
#   on:
#     pull_request:
#   jobs:
#     lint:
#       uses: akira-toriyama/.github/.github/workflows/commit-lint.yml@v1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Lint is fast; bound it so a hung step can't idle a runner for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # git log walks the already-fetched history locally; this job never
          # pushes, so don't leave the checkout token in .git/config (zizmor
          # artipacked). t-2nh8
          persist-credentials: false

      - name: Validate commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PR-context guard: this reusable lints the PR's BASE..HEAD range. In a
          # non-PR context base/head are empty, so `..` collapses to an empty range
          # and every commit "passes" silently. Fail loudly instead — call this from
          # a pull_request-triggered caller.
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "::error::commit-lint requires a pull_request context (empty base/head SHA)."
            exit 1
          fi
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert'
          pattern="^:[a-z0-9][a-z0-9_+-]*: (${types})(\([^()]+\))?!?: .+"
          fail=0
          while IFS="$(printf '\t')" read -r sha author subject; do
            case "$author" in
              *"[bot]"|"github-actions"*) continue ;;
            esac
            case "$subject" in
              "Merge "*|"Revert "*|"fixup! "*|"squash! "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::convention violation ${sha}: ${subject}"
              fail=1
            fi
          done < <(git log --no-merges --format='%H%x09%an%x09%s' "${BASE}..${HEAD}")

          if [ "$fail" -ne 0 ]; then
            echo "format: <:gitmoji:> <type>(<scope>)<!>: <subject>  — see https://github.com/akira-toriyama/.github/blob/main/CONTRIBUTING.md" >&2
            exit 1
          fi
          echo "all commits OK"

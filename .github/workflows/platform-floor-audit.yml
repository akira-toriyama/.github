# Fleet audit: every repo that depends on sill must declare a macOS platform
# floor >= the floor of the LATEST sill release.
#
# Why this exists (t-hazw / t-fs7p). When sill v2.0.0 raised its floor to macOS
# 26, the t-tbar rollout named 7 repos and applied 3 — halo / chord / glance /
# wand stayed on `.macOS(.v13)` and the task was closed done. Three weeks later
# the gap surfaced as red dependabot PRs (chord#187 / glance#39 / wand#187 /
# halo#41), and two of those repos had no required `build` check, so the red was
# even mergeable (t-9s7y). Prose memory does not stop this class of miss; a
# scheduled count does. Next time sill raises its floor, this goes red for every
# lagging consumer the same day.
#
# What it checks, in order:
#   1. sill's latest release is readable and its Package.swift declares a floor
#      — an audit that cannot read its baseline has audited nothing;
#   2. every owned repo's root Package.swift, read through
#      scripts/platform-floor-scan.sh (table-tested; comments stripped — sill's
#      own file carries a floor inside a comment): a repo with a sill dependency
#      must declare a floor, and that floor must be >= sill's;
#   3. at least one consumer matched — glyph-pin-audit's lesson that a detector
#      matching ZERO repos reads exactly like a compliant fleet, and
#      apply-repo-settings' protection detector spent two weeks that way.
#
# FAIL LOUD, NOT OPEN (t-a8zh): an API read that fails is counted and reddens
# the run — a repo that could not be read has not passed. THE AUDITOR SEES WHAT
# THE WRITER WRITES: the fleet-sync credential, a hard failure without it, and
# the private-repo canary (the 29-of-35 incident), so private consumers are
# audited, not silently skipped.

name: platform-floor-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *' # daily, after fleet-sync (06:00) and its sibling audits
  push:
    branches: [main]
    paths:
      - 'scripts/platform-floor-scan.sh'
      - '.github/workflows/platform-floor-audit.yml'

concurrency:
  group: platform-floor-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Audit every sill consumer's macOS floor against the latest sill release
        env:
          # fleet-sync's credential, NOT github.token — the default token sees
          # no private repos, and a subset audit reporting "fleet is level" is
          # the 29-of-35 incident again.
          GH_TOKEN: ${{ secrets.FLEET_SYNC_PAT }}
          OWNER: akira-toriyama
        run: |
          set -euo pipefail

          [ -n "${GH_TOKEN:-}" ] || { echo "::error::FLEET_SYNC_PAT is not set — refusing to audit with a public-only view (a private consumer would be silently skipped)."; exit 1; }

          # 1. The baseline: the latest sill RELEASE's floor — that is what the
          # next dependabot bump moves every consumer onto, so it is the floor a
          # consumer must already meet. Reading main instead would go red before
          # a floor raise even ships; reading each repo's pinned tag would stay
          # green until the bump PR is already red (the exact lateness this
          # audit exists to end).
          sill_tag="$(gh release view -R "$OWNER/sill" --json tagName --jq .tagName)" \
            || { echo "::error::cannot read the latest sill release — the audit has no baseline."; exit 1; }
          sill_pkg="$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$OWNER/sill/contents/Package.swift?ref=$sill_tag")" \
            || { echo "::error::cannot read sill's Package.swift at $sill_tag — the audit has no baseline."; exit 1; }
          sill_floor="$(printf '%s\n' "$sill_pkg" | bash scripts/platform-floor-scan.sh \
            | awk -F'\t' '$1 == "macos-floor" { print $2; exit }')"
          [ -n "$sill_floor" ] || { echo "::error::no macOS floor found in sill's Package.swift at $sill_tag — either sill dropped its platforms: declaration or the scanner went blind (see tests/platform-floor-scan.test.sh)."; exit 1; }
          echo "baseline: sill $sill_tag requires macOS >= $sill_floor"

          repo_rows="$(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork,visibility -q '.[] | select(.isFork==false) | .name + "\t" + .visibility' | sort)"
          mapfile -t REPOS < <(printf '%s\n' "$repo_rows" | cut -f1)
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::empty repo list from gh repo list — aborting (transient API failure?)."; exit 1; }

          # The private-repo canary — the SHAPE of the list, not its size (a
          # hand-kept count would rot; see glyph-pin-audit's header).
          private_n="$(printf '%s\n' "$repo_rows" | grep -c $'\tPRIVATE' || true)"
          if [ "${private_n:-0}" -eq 0 ]; then
            echo "::error::the repo list contains no private repos — the token's view is degraded (the 29-of-35 incident); refusing to call this a fleet audit."
            exit 1
          fi
          echo "auditing ${#REPOS[@]} repos ($private_n private)"

          # 2. Every repo's root Package.swift. Only a 404 is "not a Swift
          # package"; any other read failure is counted and reddens the run — a
          # repo that could not be read has NOT passed (t-a8zh's fail-open is
          # the shape to avoid).
          drift=0
          apifail=0
          consumers=0
          for repo in "${REPOS[@]}"; do
            full="$OWNER/$repo"
            pkg_err="$RUNNER_TEMP/pkg.err"
            if ! pkg="$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/$full/contents/Package.swift" 2>"$pkg_err")"; then
              if grep -q 'HTTP 404' "$pkg_err"; then continue; fi
              echo "::error::cannot read $full Package.swift — this repo was NOT audited: $(head -c 200 "$pkg_err")"
              apifail=$((apifail + 1))
              continue
            fi
            scan="$(printf '%s\n' "$pkg" | bash scripts/platform-floor-scan.sh)"
            dep_line="$(printf '%s\n' "$scan" | awk -F'\t' '$1 == "sill-dep" { print $3; exit }')"
            [ -n "$dep_line" ] || continue
            consumers=$((consumers + 1))
            floor="$(printf '%s\n' "$scan" | awk -F'\t' '$1 == "macos-floor" { print $2; exit }')"
            if [ -z "$floor" ]; then
              # No platforms: means SPM's oldest-supported default — far below
              # any sill floor, and invisible until the next bump PR goes red.
              echo "::error::$full depends on sill (Package.swift:$dep_line) but declares no macOS platform floor — the default floor is below sill's $sill_floor"
              drift=$((drift + 1))
              continue
            fi
            rc=0
            bash scripts/platform-floor-scan.sh cmp "$floor" "$sill_floor" || rc=$?
            case "$rc" in
              0) echo "ok: $full floor $floor >= sill $sill_floor" ;;
              1) echo "::error::$full declares macOS floor $floor but sill $sill_tag requires >= $sill_floor — the next sill bump PR will not build (the t-tbar leftover shape)"
                 drift=$((drift + 1)) ;;
              *) echo "::error::cannot compare $full floor '$floor' against sill '$sill_floor' — this repo was NOT audited"
                 apifail=$((apifail + 1)) ;;
            esac
          done

          # 3. Zero consumers is not a clean sweep — the family has six; a scan
          # that suddenly sees none has gone blind, not compliant.
          if [ "$consumers" -eq 0 ]; then
            echo "::error::no sill consumer matched across ${#REPOS[@]} repos — the detector has gone blind (apply-repo-settings' protection detector spent two weeks this way), refusing to report a compliant fleet."
            exit 1
          fi

          echo "checked $consumers sill consumer(s) against sill $sill_tag (macOS >= $sill_floor): $drift drifted, $apifail unreadable"
          if [ "$drift" -gt 0 ] || [ "$apifail" -gt 0 ]; then
            echo "::error::platform-floor audit failed: $drift consumer(s) below sill's floor, $apifail read failure(s) — a repo that could not be read has not passed."
            exit 1
          fi

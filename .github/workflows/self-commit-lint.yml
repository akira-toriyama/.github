name: self commit-lint

# The hub lints its OWN commits too — with glyph, the same engine the fleet
# runs. This caller is MAINTAINED BY HAND: fleet-sync EXCLUDEs this repo (it is
# the hub), so the canonical caller `fleet/commit-lint.yml` never syncs onto it.
# Keep the glyph pin below in LOCKSTEP with fleet/commit-lint.yml — when you
# bump the fleet pin, bump this one in the same PR.
#
# The job id stays `commit-lint` (not the fleet stub's `lint`) on purpose: main's
# required status check is the context "commit-lint / lint", and renaming the
# job would orphan it.

on:
  pull_request:

# Cap the token the caller hands the reusable: glyph-lint only checks out and
# reads the PR's commit range, so contents:read is all it needs. Without this
# block the job inherits the repo-default token scope (which zizmor's
# excessive-permissions audit flags), and the reusable can't request more than
# the caller grants.
permissions:
  contents: read

jobs:
  commit-lint:
    uses: akira-toriyama/glyph/.github/workflows/lint.yml@v0.3.0

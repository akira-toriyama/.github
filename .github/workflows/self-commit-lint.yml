name: self commit-lint

# The hub lints its OWN commits too. This thin caller runs the reusable
# commit-lint.yml (which lives in this repo) on every PR, so .github's own
# history follows the same gitmoji + Conventional Commits convention it enforces
# fleet-wide — and gives main a required status check for branch protection.
# (App repos call the reusable cross-repo; the hub calls it locally via `./`.)

on:
  pull_request:

# Cap the token the caller hands the reusable: commit-lint only checks out and
# reads the PR's commit range, so contents:read is all it needs. Without this
# block the job inherits the repo-default token scope (which zizmor's
# excessive-permissions audit flags), and the reusable can't request more than
# the caller grants.
permissions:
  contents: read

jobs:
  commit-lint:
    uses: ./.github/workflows/commit-lint.yml

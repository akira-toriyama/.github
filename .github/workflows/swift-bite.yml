name: swift-bite

# Reusable "do the new tests bite?" gate for the Swift half of the fleet — runs
# the pull request's new/changed Swift tests (XCTest and swift-testing alike)
# against the source BEFORE the pull request and fails when they all still pass.
# The reasoning, the verdict rules and the two opt-outs live in the script:
# actions/swift-bite/swift-bite.sh. Called by each Swift repo's build.yml.
#
# Why a gate at all: a diff can be reviewed, but the claim "I verified this fix"
# cannot. A test that would have been green without the fix is not evidence, and
# nothing except habit stops one from being merged. Habit is what this replaces —
# go-bite already replaced it for the Go half.
#
# It stands down on its own when there is nothing to prove (a test-only pull
# request, no new or changed test function, an explicit opt-out) and says so in
# the job summary — so it is safe to make a required check.
#
# Caller skeleton (beside the `build:` job in build.yml):
#   bite:
#     uses: akira-toriyama/.github/.github/workflows/swift-bite.yml@v2
#
# Only pull_request events carry the two commits the gate compares, so the job
# skip-passes on push. A pull request pays one extra checkout plus one debug
# build and one filtered `swift test` of the pre-change tree.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label. macos-26 matches the app family's platform floor
          (`swift test` executes the built binaries, and a macos-15 host cannot
          load minos-26 images); a lower-floor package may pass macos-15.
        type: string
        default: 'macos-26'
      test-args:
        description: 'Extra flags handed to the `swift test` run on the pre-change tree.'
        type: string
        default: ''
      timeout-seconds:
        description: 'Seconds before the verdict run is read as a hang.'
        type: string
        default: '600'

# The gate reads history and runs tests. Nothing else.
permissions:
  contents: read

jobs:
  bite:
    # Only a pull request has a base and a head to compare; on push there is no
    # claim under review.
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The gate walks to the merge base of base and head, so it needs the
          # history — a shallow checkout would make it exit 2 rather than guess.
          fetch-depth: 0
          # Reads history and runs tests, never pushes (zizmor artipacked).
          persist-credentials: false

      # The gate's own script lives in the hub, not in the caller — and a step's
      # `uses: ./…` resolves against the WORKSPACE, which holds the caller's
      # tree. So fetch the hub beside it. The `job` context's workflow-identity
      # properties name the repository and the resolved commit of the workflow
      # file defining this job — i.e. THIS file, at whatever tag, branch or SHA
      # the caller pinned — so the YAML and the script it runs can never drift
      # apart. (`github.*` would be the caller's.)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .swift-bite-hub
          persist-credentials: false

      # macos runners default to an older Xcode; pin the latest stable, the same
      # toolchain the family's swift-build composite builds with.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # Runs the composite the hub self-tests, from the checkout above — one
      # code path for the fleet and for the hub's own smoke.
      - uses: ./.swift-bite-hub/actions/swift-bite
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          # The MERGE commit, not the branch head. Nothing forces a rebase, so
          # on a branch the base has moved past, the head's merge base is the
          # fork point — and a test pinning behaviour the base branch ALREADY
          # SHIPS would be credited as a bite. Against the merge commit the
          # pre-change tree is the base branch as it is now, while the diff is
          # still exactly this pull request's.
          head-sha: ${{ github.sha }}
          test-args: ${{ inputs.test-args }}
          timeout-seconds: ${{ inputs.timeout-seconds }}

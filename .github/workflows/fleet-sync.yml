name: fleet-sync

# Repo standardizer (fleet file-sync). Ensures a set of STANDARD files exists in
# every owned, non-fork, non-archived repo, and distributes the per-repo secrets
# the fleet's workflows need. New repos are picked up automatically (the repo list
# is fetched at run time), so there is never a "this repo has it / that one
# doesn't" gap. `task-status` is the first managed file, but this is deliberately
# GENERAL — add more (src:dest) pairs to MANIFEST to standardize more files.
#
# Secrets to set on THIS repo (.github) — fleet-sync is DORMANT until FLEET_SYNC_PAT exists:
#   FLEET_SYNC_PAT      classic PAT, scopes `repo` + `workflow`
#                       (workflow scope is REQUIRED to write .github/workflows/* cross-repo)
#   PROJECTS_WRITE_PAT  fine-grained PAT, scoped to the tracker repo (projects) with
#                       Contents: Read & write ONLY, auto-expiring (fanned out to each repo).
#                       This REPLACES the old furrow-status-bot App master key: a leak now
#                       reaches only the tracker, and expires on its own. (t-ke0v)
#   HOMEBREW_TAP_DEPLOY_KEY  private half of homebrew-tap's WRITE deploy key — the
#                       cask-push credential, fanned out to every repo whose
#                       release-channel workflow references it (gate: the workflow
#                       must reference the secret NAME, t-21yv/t-6bhz). No expiry,
#                       and a leak grants git push to ONE repo, not an API surface.
#
# Safety: workflow_dispatch defaults to DRY-RUN (log only). Scheduled runs and
# push runs apply. Merging a canonical to main IS the deploy again (t-7t07): the
# rollout ledger that used to hold the canary -> fleet half was measured across
# every run since 2026-07-28 and rescued nothing (0 real holds in 17 rollouts,
# exit 13 and exit 2 never fired in production) while costing 59% red on the
# daily schedule and skipping the read-back below on every held day (42% duty
# cycle). Staging is now carried by whoever does the work, not by a gate —
# docs/fleet-change-policy.md, "Not enforced".
# Honesty: an apply run does not end at "sent" — a read-back step re-fetches every
# managed file from every repo and fails on any mismatch, and any write failure
# fails the job (green = the fleet HOLDS the canonical, not "the loop finished").
# A dry run's summary says DRY-RUN — NOTHING WAS DISTRIBUTED, because its green
# once read as "distributed" (t-dk1e: 34 of 35 repos stale behind a success).
# Blast radius: one repo each. PROJECTS_WRITE_PAT is a fine-grained PAT scoped to
# the tracker (Contents:RW); HOMEBREW_TAP_DEPLOY_KEY grants git push to the tap and
# no API surface at all — both far narrower than the retired App private key the
# first of them replaced.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would change without applying it.
        type: boolean
        default: true
      only-repo:
        description: Limit to a single repo name (optional).
        type: string
        default: ''
  # Merging a canonical to main is the deploy: the apply runs on the push that
  # lands it, not on the next timer tick (t-7t07). push events carry no inputs,
  # so DRY_RUN is empty -> the apply branch below runs with DRY=false against
  # every target. Keep the paths filter narrow: the apply writes nothing under
  # fleet/, so it cannot re-trigger itself (measured on the fleet-test rig,
  # runs 34989154825 -> 34989278079, no third run).
  push:
    branches: [main]
    paths: ['fleet/**']
  schedule:
    - cron: '0 6 * * *' # daily — a new repo onboards within a day, and drift is repaired

concurrency:
  group: fleet-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bounded: cancel-in-progress is false, so a wedged run would hold the
    # concurrency slot and block every scheduled run after it. Generous — a
    # full 200-repo sweep of the whole MANIFEST is well under this.
    timeout-minutes: 30
    steps:
      - name: Gate (dormant until configured)
        id: gate
        env:
          PAT: ${{ secrets.FLEET_SYNC_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::notice::FLEET_SYNC_PAT not set — fleet-sync is dormant until configured."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (.github holds the canonical files)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          # The checkout only feeds local reads of the canonical fleet/ files;
          # every fleet write goes through gh + FLEET_SYNC_PAT env, never git —
          # drop the persisted checkout token (zizmor artipacked). t-2nh8
          persist-credentials: false

      - name: Sync standard files + the tracker-write PAT across the fleet
        if: steps.gate.outputs.go == 'true'
        id: sync
        env:
          GH_TOKEN: ${{ secrets.FLEET_SYNC_PAT }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          ONLY_REPO: ${{ inputs.only-repo }}
          WRITE_PAT: ${{ secrets.PROJECTS_WRITE_PAT }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          # Repos to skip (space-separated). Only the hub is left: it holds the
          # canonicals, so syncing them onto it would overwrite each source with
          # a copy of itself. Its own lint caller is hand-maintained as a
          # consequence — docs/glyph-rollout-runbook.md says who moves that pin.
          #
          # Both temporary entries are gone. glyph-test left at the v3.0.0
          # canonical bump (#201): a range pinned differently from the fleet
          # stops rehearsing it. glyph-test2 was the conventional-profile range,
          # and the v2 engine has no profiles to diverge over — a commit means
          # what the repository's own glyph.toml says — so it was archived
          # (glyph t-jvgy) and now falls out of the --no-archived listing below
          # rather than needing a name here.
          EXCLUDE: '.github'
        run: |
          set -euo pipefail

          DRY="${DRY_RUN:-false}"
          [ "$EVENT" = "schedule" ] && DRY=false
          echo "event=$EVENT dry-run=$DRY"
          # The read-back step gates on this: it verifies APPLY runs only (a
          # dry run distributes nothing, so there is nothing to read back).
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"

          # Manifest: "<src in this repo>:<dest in each target repo>". Add lines to
          # standardize more files. The zizmor pair distributes the Actions-security
          # gate fleet-wide (t-qbp1): the caller workflow + the .github/zizmor.yml
          # policy it reads. Rolled out only after every existing repo was pre-audited
          # green (zizmor 1.26.1 + this config); new repos are onboarded clean.
          # version-preview (t-a0eq) is fleet-wide on the same pre-audit discipline: all
          # 29 targets were surveyed first, and glyph v0.4.1 carries the release-floor
          # guard that keeps the 11 tagless ones (projects: 1867 commits) from paying
          # an API round-trip per commit. It comments only where PRs are opened. Its
          # dest is version-preview.yml, NOT pr-verdict.yml — see the collision guard.
          # dependabot.yml is NOT in this list — it is ASSEMBLED per repo inside
          # the loop below (base + fleet/dependabot.d/ blocks; t-s3fp, t-vhr9).
          MANIFEST="fleet/task-status.yml:.github/workflows/task-status.yml fleet/commit-lint.yml:.github/workflows/commit-lint.yml fleet/taplo.yml:.github/workflows/taplo.yml fleet/zizmor.yml:.github/workflows/zizmor.yml fleet/zizmor-config.yml:.github/zizmor.yml fleet/actionlint.yml:.github/workflows/actionlint.yml fleet/version-preview.yml:.github/workflows/version-preview.yml fleet/commit-convention.md:docs/commit-convention.md fleet/repo-policy.yml:.github/workflows/repo-policy.yml"

          # PRUNE: paths to DELETE from every target repo if present — how a canonical
          # is retired. Renaming one (fleet/x.yml -> fleet/y.yml) otherwise leaves the
          # old copy behind in ~30 repos, still running, and there is no per-repo hand
          # to remove it: editing .github/workflows/* over the API needs a token with
          # the workflow scope, which is exactly what this job's PAT has and a human's
          # gh login does not. Entries are removed from this list once a run reports
          # every repo already clean.
          #
          # pr-verdict.yml: renamed to version-preview.yml after it overwrote glyph's
          # reusable (see the collision guard). Leaving it would race the new caller
          # for the same sticky comment.
          PRUNE=".github/workflows/pr-verdict.yml"

          # The read-back step re-checks these same lists; hand it the ONE
          # definition rather than keeping a second copy to drift
          # (tests/fleet-manifest.test.sh parses the assignments above, which
          # is why they stay shell assignments here and not job-level env).
          { echo "MANIFEST=$MANIFEST"; echo "PRUNE=$PRUNE"; echo "EXCLUDE=$EXCLUDE"; } >> "$GITHUB_ENV"

          # REUSABLE-COLLISION GUARD. glyph is inside this fleet, and the workflows it
          # ships as reusable DEFINITIONS live at the same kind of path a caller syncs
          # to. On 2026-07-17 fleet/pr-verdict.yml:.github/workflows/pr-verdict.yml
          # overwrote glyph's 287-line reusable with its own 25-line caller; only the
          # tags callers pin (never main) kept the fleet running, and the next release
          # would have shipped a reusable that was just a caller. A manifest line whose
          # dest collides with a glyph reusable is therefore a hard error, not a sync:
          # the mistake is one MANIFEST edit away and no reviewer should have to
          # remember it. Named literally — this is a name-space fact about glyph's
          # published interface, not something to derive by fetching it at run time.
          GLYPH_REUSABLES="lint.yml release.yml pr-verdict.yml"
          for pair in $MANIFEST; do
            dest="${pair##*:}"
            case "$dest" in
              .github/workflows/*)
                for reusable in $GLYPH_REUSABLES; do
                  if [ "$dest" = ".github/workflows/$reusable" ]; then
                    echo "::error::manifest dest '$dest' collides with glyph's reusable '$reusable' — syncing it would overwrite the definition in akira-toriyama/glyph with a caller stub. Rename the dest (the commit-lint caller is not named lint.yml for exactly this reason)."
                    exit 1
                  fi
                done
                ;;
            esac
          done

          mapfile -t REPOS < <(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork -q '.[] | select(.isFork==false) | .name' | sort)
          echo "candidate repos: ${#REPOS[@]}"
          # A transient gh/API failure inside the process substitution can't trip
          # set -e, so guard the result. This catches an EMPTY list only — a
          # truncated one (say a single repo) still passes and quietly no-ops the
          # rest of the fleet. Raising the floor to a hard number would be a second
          # hand-kept fleet count to rot, so the honest fix is the read-back that
          # t-dk1e tracks: verify what landed instead of trusting what was sent.
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::empty repo list from gh repo list — aborting (transient API failure?)."; exit 1; }

          # Four counters, and only ONE of them is a promise. `queued` counts
          # intent (a diff was seen — it increments BEFORE the dry-run gate,
          # so it is the number a dry run reports); `applied` counts writes
          # that actually returned success; `pending` counts changes parked in
          # an open PR (a protected branch is a legitimate resting state, not
          # a failure); `failed` counts every write-path error that used to be
          # a ::warning:: on a green run. Run 29084025682 (2026-07-10) failed
          # to write a file and still returned success — that is the precise
          # lie this split exists to end: failed > 0 now fails the job.
          queued=0 applied=0 pending=0 failed=0 secrets_set=0
          mkdir -p "$RUNNER_TEMP/assembled"
          for repo in "${REPOS[@]}"; do
            case " $EXCLUDE " in *" $repo "*) echo "skip(excluded): $repo"; continue;; esac
            if [ -n "$ONLY_REPO" ] && [ "$repo" != "$ONLY_REPO" ]; then continue; fi
            full="$OWNER/$repo"

            # dependabot.yml is ASSEMBLED per repo: the base (github-actions only)
            # plus one fleet/dependabot.d/ block per package ecosystem whose ROOT
            # manifest exists on the target. An ecosystem configured without its
            # manifest is NOT a no-op — Dependabot records a failing run every
            # week (t-s3fp) — and a base-only overwrite ERASES a repo's real
            # ecosystems (t-vhr9: the old go.mod-only variant selection wiped
            # chord's swift and study-engine's npm entries, killing their bump
            # PRs). Probes distinguish 404 (absent — normal) from transient API
            # errors, like the tap gate below: misreading an error as "absent"
            # would assemble the WRONG file and erase entries for a day.
            # Assembled under a per-repo NAME so the read-back step can verify
            # dependabot.yml against the exact bytes this run intended for
            # this repo — reassembling there would duplicate the probe logic.
            dep_src="$RUNNER_TEMP/assembled/$repo.yml"
            cp fleet/dependabot.yml "$dep_src"
            dep_ok=true
            for probe in go.mod:gomod Package.swift:swift package.json:npm; do
              manifest="${probe%%:*}"; eco="${probe##*:}"
              probe_err="$RUNNER_TEMP/dep-probe.err"
              if gh api "repos/$full/contents/$manifest" >/dev/null 2>"$probe_err"; then
                cat "fleet/dependabot.d/$eco.yml" >> "$dep_src"
              elif ! grep -q 'HTTP 404' "$probe_err"; then
                echo "::warning::fleet: dependabot probe failed for $full $manifest (skipping dependabot.yml for this repo this run): $(head -c 200 "$probe_err")"
                dep_ok=false
                failed=$((failed + 1))
                break
              fi
            done
            dep_pair=""
            if [ "$dep_ok" = true ]; then
              dep_pair="$dep_src:.github/dependabot.yml"
            else
              # A half-assembled file must not survive into the read-back.
              rm -f "$dep_src"
            fi

            # 1) sync the manifest files — decide per FILE, land per REPO. Every
            #    changed file rides one bundled commit (scripts/fleet-commit-bundle.sh):
            #    the Contents API wrote one commit per file, so a two-file sync
            #    pushed twice a second apart, each push fired the target's release
            #    run, and a fleet sweep stacked those windows until several repos'
            #    draft PATCHes landed in the same second and drew bare 403s — the
            #    intermittent red t-z7c1 measured. One push per repo removes the
            #    stacking at its source; the [bot] author moves with the commit
            #    (it is what keeps these out of glyph's lint and release folds,
            #    t-kbqx — asserted by the bundle script's table test).
            changed_pairs=()
            for pair in $MANIFEST $dep_pair; do
              src="${pair%%:*}"; dest="${pair##*:}"
              local_b64="$(base64 < "$src" | tr -d '\n')"
              if remote_json="$(gh api "repos/$full/contents/$dest" 2>/dev/null)"; then
                remote_b64="$(printf '%s' "$remote_json" | jq -r '.content' | tr -d '\n')"
                if [ "$remote_b64" = "$local_b64" ]; then
                  echo "ok(up-to-date): $full $dest"
                  continue
                fi
              fi
              echo "needs-sync: $full $dest"
              queued=$((queued + 1))
              [ "$DRY" = "true" ] && continue
              changed_pairs+=("$pair")
            done

            # Per-repo failures must NOT abort the rest of the fleet: warn, COUNT,
            # and skip this repo's files for this run (the next run is idempotent).
            # The count is what turns the run red at the end — a warning alone let
            # run 29084025682 drop a write and still report success.
            fallback_pairs=()
            if [ "${#changed_pairs[@]}" -gt 0 ]; then
              if ! db="$(gh api "repos/$full" --jq .default_branch)"; then
                echo "::warning::fleet: cannot read default branch for $full; skipping its ${#changed_pairs[@]} changed file(s)"
                failed=$((failed + ${#changed_pairs[@]}))
              else
                bundle_rc=0
                out="$(bash scripts/fleet-commit-bundle.sh "$full" "$db" "${changed_pairs[@]}")" || bundle_rc=$?
                if [ "$bundle_rc" -eq 0 ]; then
                  echo "synced(one push): $full — $out"
                  applied=$((applied + ${#changed_pairs[@]}))
                elif [ "$bundle_rc" -eq 3 ]; then
                  # Protected default branch: land each file as a PR, exactly as
                  # the Contents-API path did. PR branches fire no release run,
                  # so bundling buys nothing there, and the per-file branches
                  # keep their names (pr-exists dedup depends on them).
                  echo "direct push rejected for $full — landing each file as a PR"
                  fallback_pairs=("${changed_pairs[@]}")
                else
                  echo "::warning::fleet: bundled commit failed for $full; skipping its ${#changed_pairs[@]} changed file(s) this run"
                  failed=$((failed + ${#changed_pairs[@]}))
                fi
              fi
            fi

            for pair in ${fallback_pairs[@]+"${fallback_pairs[@]}"}; do
              src="${pair%%:*}"; dest="${pair##*:}"
              local_b64="$(base64 < "$src" | tr -d '\n')"
              destbase="$(basename "$dest")"
              branch="fleet-sync/${destbase%.*}"
              if ! gh api "repos/$full/git/ref/heads/$branch" >/dev/null 2>/dev/null; then
                bsha="$(gh api "repos/$full/git/ref/heads/$db" --jq .object.sha)" \
                  || { echo "::warning::fleet: cannot read $db tip for $full; skipping $dest"; failed=$((failed + 1)); continue; }
                gh api -X POST "repos/$full/git/refs" -f "ref=refs/heads/$branch" -f "sha=$bsha" >/dev/null \
                  || { echo "::warning::fleet: cannot create branch $branch on $full; skipping $dest"; failed=$((failed + 1)); continue; }
              fi
              # The Contents API commits on every PUT, identical bytes included, so a
              # re-run must skip a branch that already holds the canonical or stack
              # an empty commit on the PR each night.
              bsha2=""; need_put=1
              if bjson="$(gh api "repos/$full/contents/$dest?ref=$branch" 2>/dev/null)"; then
                bb64="$(printf '%s' "$bjson" | jq -r '.content' | tr -d '\n')"
                bsha2="$(printf '%s' "$bjson" | jq -r '.sha')"
                [ "$bb64" = "$local_b64" ] && need_put=0
              fi
              if [ "$need_put" = 1 ]; then
                # Same [bot] author as the direct-commit path. It exempts
                # nothing: exclude_authors is a literal list and no fleet
                # glyph.toml carries this name (see scripts/fleet-commit-bundle.sh).
                # The `=` is what makes the subject lint-clean and fold none.
                pargs=(-X PUT "repos/$full/contents/$dest"
                  -f "message=:wrench:(fleet)= sync $dest"
                  -f "author[name]=fleet-sync[bot]"
                  -f "author[email]=fleet-sync[bot]@users.noreply.github.com"
                  -f "content=$local_b64" -f "branch=$branch")
                [ -n "$bsha2" ] && pargs+=(-f "sha=$bsha2")
                gh api "${pargs[@]}" >/dev/null \
                  || { echo "::warning::fleet: cannot write $dest on $full@$branch; skipping"; failed=$((failed + 1)); continue; }
              fi
              # `gh pr create` exits non-zero BOTH when a PR already exists and on a
              # real failure; capture stderr so a genuine error isn't logged as the
              # reassuring "pr-exists".
              if pr_err="$(gh pr create --repo "$full" --base "$db" --head "$branch" \
                   --title ":wrench:(fleet)= sync $dest" \
                   --body "Automated standard-file sync from akira-toriyama/.github (fleet-sync). The default branch is protected, so this lands as a PR." 2>&1)"; then
                echo "pr-opened: $full $dest"
                pending=$((pending + 1))
              else
                case "$pr_err" in
                  *"already exists"*) echo "pr-exists: $full $dest"; pending=$((pending + 1)) ;;
                  *) echo "::warning::fleet: pr-create failed for $full $dest: $pr_err"; failed=$((failed + 1)) ;;
                esac
              fi
            done

            # 2) prune retired paths — delete what a rename left behind.
            for dead in $PRUNE; do
              dead_json="$(gh api "repos/$full/contents/$dead" 2>/dev/null)" || continue # already clean
              # NEVER prune a reusable DEFINITION. glyph keeps its reusables at the
              # same kind of path a caller occupies everywhere else, and this list
              # exists precisely BECAUSE a caller once landed on one — pruning must
              # not finish the job that collision started. Decided on CONTENT, not on
              # a repo name: a workflow_call file is something callers pin, whoever
              # owns it, and no fleet operation may delete one by accident.
              if printf '%s' "$dead_json" | jq -r '.content' | base64 -d 2>/dev/null | grep -q "workflow_call"; then
                echo "skip(reusable): $full $dead defines a reusable — not a caller; refusing to prune"
                continue
              fi
              echo "needs-prune: $full $dead"
              queued=$((queued + 1))
              [ "$DRY" = "true" ] && continue
              dead_sha="$(printf '%s' "$dead_json" | jq -r '.sha')"
              # `=` is the sigil-grammar declaration (glyph v3: footers are not
              # parsed, the sigil is the whole signal): deleting a distributed
              # COPY of a retired canonical is not an API removal, so it folds
              # none. The body sentence stays for the reader. Multiline -f
              # values reach the Contents API byte-for-byte (measured on
              # glyph-test, t-271n).
              dmsg="$(printf ':fire:(fleet)= drop retired %s\n\nRemoving a distributed copy of a retired canonical file, not an API removal.' "$dead")"
              dargs=(-X DELETE "repos/$full/contents/$dead"
                -f "message=$dmsg"
                -f "author[name]=fleet-sync[bot]"
                -f "author[email]=fleet-sync[bot]@users.noreply.github.com"
                -f "sha=$dead_sha")
              if gh api "${dargs[@]}" >/dev/null 2>/dev/null; then
                echo "pruned: $full $dead"
                applied=$((applied + 1))
                continue
              fi
              # Protected default branch: land the deletion as a PR, mirroring the
              # sync path's fallback. Per-repo failures warn and carry on.
              echo "direct delete rejected for $full $dead — using a PR"
              db="$(gh api "repos/$full" --jq .default_branch)" \
                || { echo "::warning::fleet: cannot read default branch for $full; skipping prune of $dead"; failed=$((failed + 1)); continue; }
              deadbase="$(basename "$dead")"
              branch="fleet-sync/prune-${deadbase%.*}"
              if ! gh api "repos/$full/git/ref/heads/$branch" >/dev/null 2>/dev/null; then
                bsha="$(gh api "repos/$full/git/ref/heads/$db" --jq .object.sha)" \
                  || { echo "::warning::fleet: cannot read $db tip for $full; skipping prune of $dead"; failed=$((failed + 1)); continue; }
                gh api -X POST "repos/$full/git/refs" -f "ref=refs/heads/$branch" -f "sha=$bsha" >/dev/null \
                  || { echo "::warning::fleet: cannot create branch $branch on $full; skipping prune of $dead"; failed=$((failed + 1)); continue; }
              fi
              # Only delete on the branch if it is still there (a re-run must not fail
              # on an already-pruned branch).
              if bjson="$(gh api "repos/$full/contents/$dead?ref=$branch" 2>/dev/null)"; then
                gh api -X DELETE "repos/$full/contents/$dead" \
                  -f "message=$dmsg" \
                  -f "author[name]=fleet-sync[bot]" \
                  -f "author[email]=fleet-sync[bot]@users.noreply.github.com" \
                  -f "sha=$(printf '%s' "$bjson" | jq -r '.sha')" -f "branch=$branch" >/dev/null \
                  || { echo "::warning::fleet: cannot delete $dead on $full@$branch; skipping"; failed=$((failed + 1)); continue; }
              fi
              if pr_err="$(gh pr create --repo "$full" --base "$db" --head "$branch" \
                   --title ":fire:(fleet)= drop retired $dead" \
                   --body "Automated retirement of a standard file from akira-toriyama/.github (fleet-sync). The default branch is protected, so this lands as a PR." 2>&1)"; then
                echo "prune-pr-opened: $full $dead"
                pending=$((pending + 1))
              else
                case "$pr_err" in
                  *"already exists"*) echo "prune-pr-exists: $full $dead"; pending=$((pending + 1)) ;;
                  *) echo "::warning::fleet: prune pr-create failed for $full $dead: $pr_err"; failed=$((failed + 1)) ;;
                esac
              fi
            done

            # 3) fan out the tracker-write PAT — ONLY to repos that actually carry
            #    the task-status stub on their default branch (idempotent overwrite).
            #    Least privilege: a repo holds the tracker-write PAT only once it
            #    runs the workflow that needs it. A stub that landed as a PR (a
            #    protected default branch) is not yet on the default branch, so its
            #    secret waits for the next run after that PR merges. This only gates
            #    NEW fan-out; it does not prune an already-set secret.
            if [ -z "${WRITE_PAT:-}" ]; then
              echo "::warning::PROJECTS_WRITE_PAT not set on .github; skipping secret fan-out for $full"
            elif ! gh api "repos/$full/contents/.github/workflows/task-status.yml" >/dev/null 2>/dev/null; then
              echo "skip-secret(no task-status stub on default branch): $full"
            elif [ "$DRY" = "true" ]; then
              echo "would-set-secrets: $full (PROJECTS_WRITE_PAT)"
            else
              if printf '%s' "$WRITE_PAT" | gh secret set PROJECTS_WRITE_PAT --repo "$full"; then
                echo "secrets-set: $full"
                secrets_set=$((secrets_set + 1))
              else
                echo "::warning::fleet: secret fan-out failed for $full"
                failed=$((failed + 1))
              fi
            fi

            # 4) fan out the cask-push credential — same shape as (3), gated on
            #    the consumer workflow. Unlike (3) the gate reads CONTENT, not
            #    mere existence: a secret goes to a repo iff one of the fleet's
            #    release-channel files — release.yml (Go GoReleaser flavor),
            #    update-tap.yml (Swift flavor), goreleaser.yml (glyph, whose
            #    release.yml is the family reusable) — references that secret's
            #    NAME on the default branch. Existence alone proved too broad on
            #    the first dry-run (dotfiles/canon/glyph-test/swift-toml-edit
            #    carry a cask-less release.yml). The gate kills the per-repo
            #    "does this one need it?" judgment that let hand-placed copies
            #    rot (t-21yv: rundiff's tap cask silently stuck at v0.2.0, prq
            #    released into a 401). Idempotent overwrite; this only gates NEW
            #    fan-out and never prunes an already-set secret — the stale
            #    HOMEBREW_TAP_TOKEN copies the retired PAT arm left behind
            #    (t-6bhz) can only be removed by hand.
            tap_consumer=false
            if [ -n "${TAP_KEY:-}" ]; then
              for wf in release.yml update-tap.yml goreleaser.yml; do
                # Fetch and match SEPARATELY: a transient API failure must not
                # be misread as "not a consumer" — the second dry-run silently
                # skipped furrow exactly that way. 404 = file absent (normal);
                # anything else is warned so a skipped repo is findable in the
                # log (the daily idempotent rerun heals it).
                gate_err="$RUNNER_TEMP/tap-gate.err"
                if content="$(gh api "repos/$full/contents/.github/workflows/$wf" --jq '.content' 2>"$gate_err")"; then
                  if printf '%s' "$content" | base64 -d 2>/dev/null | grep -q HOMEBREW_TAP_DEPLOY_KEY; then
                    tap_consumer=true
                    break
                  fi
                elif ! grep -q 'HTTP 404' "$gate_err"; then
                  echo "::warning::fleet: tap-gate read failed for $full $wf (treated as non-consumer this run): $(head -c 200 "$gate_err")"
                fi
              done
            fi
            if [ -z "${TAP_KEY:-}" ]; then
              echo "::warning::HOMEBREW_TAP_DEPLOY_KEY not set on .github; skipping its fan-out for $full"
            elif [ "$tap_consumer" != "true" ]; then
              echo "skip-tap-secret(no HOMEBREW_TAP_DEPLOY_KEY consumer in release-channel workflows): $full"
            elif [ "$DRY" = "true" ]; then
              echo "would-set-secrets: $full (HOMEBREW_TAP_DEPLOY_KEY)"
            else
              if printf '%s' "$TAP_KEY" | gh secret set HOMEBREW_TAP_DEPLOY_KEY --repo "$full"; then
                echo "tap-secret-set: $full (HOMEBREW_TAP_DEPLOY_KEY)"
                secrets_set=$((secrets_set + 1))
              else
                echo "::warning::fleet: tap-secret fan-out failed for $full (HOMEBREW_TAP_DEPLOY_KEY)"
                failed=$((failed + 1))
              fi
            fi
          done

          echo "done: queued=$queued applied=$applied pending(pr)=$pending failed=$failed secrets-set=$secrets_set; dry-run=$DRY across ${#REPOS[@]} repo(s)"

          # The summary a human actually reads. A dry run's green USED to read
          # exactly like "already up to date" — "green run, zero effect" is how
          # v0.11.0 was reported distributed while 34 of 35 repos sat on the old
          # pin (t-dk1e). The heading makes that misread impossible.
          if [ "$DRY" = "true" ]; then
            {
              echo "# DRY-RUN — NOTHING WAS DISTRIBUTED"
              echo
              echo "$queued file change(s) across ${#REPOS[@]} repo(s) WOULD be applied."
              echo "Re-run with \`-f dry-run=false\` to distribute."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# fleet-sync applied"
              echo
              echo "| queued | applied | pending (PR) | failed | secrets set |"
              echo "|---|---|---|---|---|"
              echo "| $queued | $applied | $pending | $failed | $secrets_set |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Green must mean "the fleet is in the intended state", not "the loop
          # finished". Every failure above already warned per repo and moved on
          # (per-repo isolation is right — one broken repo must not starve the
          # other 34); this is where the run stops pretending those were fine.
          if [ "$failed" -gt 0 ]; then
            echo "::error::fleet-sync: $failed write(s)/read(s) failed — the fleet is NOT in the state this run intended. See the warnings above; the read-back step below shows what actually landed."
            exit 1
          fi

      # A workflow that claims "applied" verifies its own claim before it ends
      # (t-dk1e). Everything above counts what this run SENT; this step reads
      # back what the fleet actually HOLDS — from the API, not from the loop's
      # own bookkeeping — and fails on any mismatch. It runs even when the sync
      # step went red (!cancelled()), because "how much of the fleet is stale"
      # is exactly what you need to know then. Two states are acceptable:
      # byte-identical on the default branch, or parked in an OPEN PR carrying
      # the canonical bytes (a protected branch cannot receive a direct push).
      # A file this step cannot READ is a failure too — "could not verify" and
      # "verified" must not both be green (the same fail-loud rule as
      # glyph-pin-scan). Scope: this verifies FILES; secret fan-out cannot be
      # read back by design, so its truth remains the set-time exit codes the
      # counters above already enforce.
      - name: Read back what the fleet actually holds
        id: readback
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' && steps.sync.outputs.dry == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_SYNC_PAT }}
          OWNER: ${{ github.repository_owner }}
          ONLY_REPO: ${{ inputs.only-repo }}
          # EXCLUDE arrives via GITHUB_ENV from the sync step, like MANIFEST.
        run: |
          set -euo pipefail

          # MANIFEST and PRUNE arrive via GITHUB_ENV from the sync step — one
          # definition, no drifting copy. Their ABSENCE means the sync step
          # died before defining them; verifying zero files against zero
          # canonicals would pass vacuously, which is the exact green-that-
          # means-nothing this step exists to end.
          [ -n "${MANIFEST:-}" ] || { echo "::error::read-back: MANIFEST not inherited from the sync step — refusing a vacuous pass."; exit 1; }
          [ -n "${PRUNE:-}" ] || { echo "::error::read-back: PRUNE not inherited from the sync step — refusing a vacuous pass."; exit 1; }
          [ -n "${EXCLUDE:-}" ] || { echo "::error::read-back: EXCLUDE not inherited from the sync step — the hub would be misread as a stale fleet repo."; exit 1; }

          # Every per-file verdict is also recorded as one JSON line, so the
          # canary-evidence recorder below can quote what was actually READ
          # rather than re-fetching (and possibly re-judging) it.
          RESULTS="$RUNNER_TEMP/readback-results.jsonl"
          : > "$RESULTS"
          record() { jq -cn --arg repo "$1" --arg dest "$2" --arg state "$3" '{repo: $repo, dest: $dest, state: $state}' >> "$RESULTS"; }

          mapfile -t REPOS < <(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork -q '.[] | select(.isFork==false) | .name' | sort)
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::read-back: empty repo list from gh repo list — cannot verify anything."; exit 1; }

          ok=0; pending=0; stale=0; unreadable=0; audited=0
          for repo in "${REPOS[@]}"; do
            case " $EXCLUDE " in *" $repo "*) continue;; esac
            if [ -n "$ONLY_REPO" ] && [ "$repo" != "$ONLY_REPO" ]; then continue; fi
            full="$OWNER/$repo"
            audited=$((audited + 1))

            # dependabot.yml is per-repo assembled; the sync step left this
            # run's intended bytes under the repo's name. No file means the
            # probe failed there — already counted as a failure by the sync
            # step, so it is only noted here, not double-counted.
            dep_pair=""
            if [ -f "$RUNNER_TEMP/assembled/$repo.yml" ]; then
              dep_pair="$RUNNER_TEMP/assembled/$repo.yml:.github/dependabot.yml"
            else
              echo "note: $full dependabot.yml not verified (assembly was skipped this run)"
            fi

            for pair in $MANIFEST $dep_pair; do
              src="${pair%%:*}"; dest="${pair##*:}"
              want_b64="$(base64 < "$src" | tr -d '\n')"
              err="$RUNNER_TEMP/readback.err"
              if got_json="$(gh api "repos/$full/contents/$dest" 2>"$err")"; then
                if [ "$(printf '%s' "$got_json" | jq -r '.content' | tr -d '\n')" = "$want_b64" ]; then
                  record "$full" "$dest" "ok"
                  ok=$((ok + 1)); continue
                fi
              elif ! grep -q 'HTTP 404' "$err"; then
                echo "::error::read-back: cannot read $full $dest — cannot confirm it was distributed: $(head -c 200 "$err")"
                record "$full" "$dest" "unreadable"
                unreadable=$((unreadable + 1)); continue
              fi
              # Missing or different on the default branch: acceptable ONLY as
              # an open PR whose branch carries the canonical bytes.
              destbase="$(basename "$dest")"
              branch="fleet-sync/${destbase%.*}"
              if bjson="$(gh api "repos/$full/contents/$dest?ref=$branch" 2>/dev/null)" \
                 && [ "$(printf '%s' "$bjson" | jq -r '.content' | tr -d '\n')" = "$want_b64" ] \
                 && [ -n "$(gh pr list --repo "$full" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
                echo "pending(pr-open): $full $dest"
                record "$full" "$dest" "pending-pr"
                pending=$((pending + 1)); continue
              fi
              echo "::error::read-back: $full $dest is STALE after an apply run — the write did not land and no open PR carries it"
              record "$full" "$dest" "stale"
              stale=$((stale + 1))
            done

            for dead in $PRUNE; do
              err="$RUNNER_TEMP/readback.err"
              if dead_json="$(gh api "repos/$full/contents/$dead" 2>"$err")"; then
                # A reusable DEFINITION at a retired path is deliberately not
                # pruned (see the sync step) — deliberate skips are not stale.
                if printf '%s' "$dead_json" | jq -r '.content' | base64 -d 2>/dev/null | grep -q "workflow_call"; then
                  record "$full" "$dead" "prune-skipped-reusable"
                  ok=$((ok + 1)); continue
                fi
                deadbase="$(basename "$dead")"
                branch="fleet-sync/prune-${deadbase%.*}"
                if ! gh api "repos/$full/contents/$dead?ref=$branch" >/dev/null 2>&1 \
                   && [ -n "$(gh pr list --repo "$full" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
                  echo "pending(prune-pr-open): $full $dead"
                  record "$full" "$dead" "prune-pending-pr"
                  pending=$((pending + 1)); continue
                fi
                echo "::error::read-back: $full still carries retired $dead after an apply run"
                record "$full" "$dead" "prune-stale"
                stale=$((stale + 1))
              elif ! grep -q 'HTTP 404' "$err"; then
                echo "::error::read-back: cannot read $full $dead: $(head -c 200 "$err")"
                record "$full" "$dead" "prune-unreadable"
                unreadable=$((unreadable + 1))
              else
                record "$full" "$dead" "prune-clean"
                ok=$((ok + 1))
              fi
            done
          done

          echo "read-back: $audited repo(s) verified / ${#REPOS[@]} listed; $ok ok, $pending pending(pr), $stale stale, $unreadable unreadable"
          {
            echo "## read-back: $audited repo(s) — $ok ok, $pending pending (PR), $stale stale, $unreadable unreadable"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stale" -gt 0 ] || [ "$unreadable" -gt 0 ]; then
            echo "::error::read-back: the fleet does NOT hold what this apply run claims ($stale stale, $unreadable unreadable). Success above was a claim; this is the measurement."
            exit 1
          fi

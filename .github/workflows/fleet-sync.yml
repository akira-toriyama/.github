name: fleet-sync

# Repo standardizer (fleet file-sync). Ensures a set of STANDARD files exists in
# every owned, non-fork, non-archived repo, and distributes the tracker-write PAT
# those files need. New repos are picked up automatically (the repo list
# is fetched at run time), so there is never a "this repo has it / that one
# doesn't" gap. `task-status` is the first managed file, but this is deliberately
# GENERAL — add more (src:dest) pairs to MANIFEST to standardize more files.
#
# Secrets to set on THIS repo (.github) — fleet-sync is DORMANT until FLEET_SYNC_PAT exists:
#   FLEET_SYNC_PAT      classic PAT, scopes `repo` + `workflow`
#                       (workflow scope is REQUIRED to write .github/workflows/* cross-repo)
#   PROJECTS_WRITE_PAT  fine-grained PAT, scoped to the tracker repo (projects) with
#                       Contents: Read & write ONLY, auto-expiring (fanned out to each repo).
#                       This REPLACES the old furrow-status-bot App master key: a leak now
#                       reaches only the tracker, and expires on its own. (t-ke0v)
#
# Safety: workflow_dispatch defaults to DRY-RUN (log only). Scheduled runs apply.
# Blast radius: the fanned-out secret is a least-privilege, self-expiring PAT (tracker
# Contents:RW only) — far narrower than the retired App private key it replaces.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would change without applying it.
        type: boolean
        default: true
      only-repo:
        description: Limit to a single repo name (optional).
        type: string
        default: ''
  schedule:
    - cron: '0 6 * * *' # daily — a new repo onboards within a day

concurrency:
  group: fleet-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Gate (dormant until configured)
        id: gate
        env:
          PAT: ${{ secrets.FLEET_SYNC_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::notice::FLEET_SYNC_PAT not set — fleet-sync is dormant until configured."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (.github holds the canonical files)
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7

      - name: Sync standard files + the tracker-write PAT across the fleet
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_SYNC_PAT }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          ONLY_REPO: ${{ inputs.only-repo }}
          WRITE_PAT: ${{ secrets.PROJECTS_WRITE_PAT }}
          # Repos to skip (space-separated). .github is the hub itself.
          EXCLUDE: '.github'
        run: |
          set -euo pipefail

          # Scheduled runs always apply; manual runs honor the dry-run input.
          DRY="${DRY_RUN:-false}"
          [ "$EVENT" = "schedule" ] && DRY=false
          echo "event=$EVENT dry-run=$DRY"

          # Manifest: "<src in this repo>:<dest in each target repo>". Add lines to
          # standardize more files. v1 = the task-status caller stub.
          MANIFEST="fleet/task-status.yml:.github/workflows/task-status.yml fleet/dependabot.yml:.github/dependabot.yml fleet/commit-lint.yml:.github/workflows/commit-lint.yml fleet/taplo.yml:.github/workflows/taplo.yml"

          # Target repos: owned, non-fork, non-archived (new repos auto-included).
          mapfile -t REPOS < <(gh repo list "$OWNER" --no-archived --source --limit 200 \
            --json name,isFork -q '.[] | select(.isFork==false) | .name' | sort)
          echo "candidate repos: ${#REPOS[@]}"
          # A transient gh/API failure inside the process substitution can't trip
          # set -e; guard so a silently empty/short list can't no-op the whole fleet.
          [ "${#REPOS[@]}" -ge 1 ] || { echo "::error::empty repo list from gh repo list — aborting (transient API failure?)."; exit 1; }

          changed=0
          for repo in "${REPOS[@]}"; do
            case " $EXCLUDE " in *" $repo "*) echo "skip(excluded): $repo"; continue;; esac
            if [ -n "$ONLY_REPO" ] && [ "$repo" != "$ONLY_REPO" ]; then continue; fi
            full="$OWNER/$repo"

            # 1) sync each manifest file (create or update on the default branch)
            for pair in $MANIFEST; do
              src="${pair%%:*}"; dest="${pair##*:}"
              local_b64="$(base64 < "$src" | tr -d '\n')"
              if remote_json="$(gh api "repos/$full/contents/$dest" 2>/dev/null)"; then
                remote_b64="$(printf '%s' "$remote_json" | jq -r '.content' | tr -d '\n')"
                sha="$(printf '%s' "$remote_json" | jq -r '.sha')"
                if [ "$remote_b64" = "$local_b64" ]; then
                  echo "ok(up-to-date): $full $dest"
                  continue
                fi
              else
                sha=""
              fi
              echo "needs-sync: $full $dest"
              changed=$((changed + 1))
              [ "$DRY" = "true" ] && continue

              # Try a direct commit to the default branch.
              args=(-X PUT "repos/$full/contents/$dest"
                -f "message=:robot: chore(fleet): sync $dest"
                -f "content=$local_b64")
              [ -n "$sha" ] && args+=(-f "sha=$sha")
              if gh api "${args[@]}" >/dev/null 2>/dev/null; then
                echo "synced: $full $dest"
                continue
              fi

              # Rejected (e.g. a protected default branch -> HTTP 409): land it as a PR.
              echo "direct commit rejected for $full $dest — using a PR"
              # Per-repo failures must NOT abort the rest of the fleet: warn + skip
              # this file for this repo and carry on (the next run is idempotent).
              db="$(gh api "repos/$full" --jq .default_branch)" \
                || { echo "::warning::fleet: cannot read default branch for $full; skipping $dest"; continue; }
              branch="fleet-sync/$(basename "$dest" .yml)"
              if ! gh api "repos/$full/git/ref/heads/$branch" >/dev/null 2>/dev/null; then
                bsha="$(gh api "repos/$full/git/ref/heads/$db" --jq .object.sha)" \
                  || { echo "::warning::fleet: cannot read $db tip for $full; skipping $dest"; continue; }
                gh api -X POST "repos/$full/git/refs" -f "ref=refs/heads/$branch" -f "sha=$bsha" >/dev/null \
                  || { echo "::warning::fleet: cannot create branch $branch on $full; skipping $dest"; continue; }
              fi
              # Update the branch file only if it differs (no empty commits on re-runs).
              bsha2=""; need_put=1
              if bjson="$(gh api "repos/$full/contents/$dest?ref=$branch" 2>/dev/null)"; then
                bb64="$(printf '%s' "$bjson" | jq -r '.content' | tr -d '\n')"
                bsha2="$(printf '%s' "$bjson" | jq -r '.sha')"
                [ "$bb64" = "$local_b64" ] && need_put=0
              fi
              if [ "$need_put" = 1 ]; then
                pargs=(-X PUT "repos/$full/contents/$dest"
                  -f "message=:robot: chore(fleet): sync $dest"
                  -f "content=$local_b64" -f "branch=$branch")
                [ -n "$bsha2" ] && pargs+=(-f "sha=$bsha2")
                gh api "${pargs[@]}" >/dev/null \
                  || { echo "::warning::fleet: cannot write $dest on $full@$branch; skipping"; continue; }
              fi
              # `gh pr create` exits non-zero BOTH when a PR already exists and on a
              # real failure; capture stderr so a genuine error isn't logged as the
              # reassuring "pr-exists".
              if pr_err="$(gh pr create --repo "$full" --base "$db" --head "$branch" \
                   --title ":robot: chore(fleet): sync $dest" \
                   --body "Automated standard-file sync from akira-toriyama/.github (fleet-sync). The default branch is protected, so this lands as a PR." 2>&1)"; then
                echo "pr-opened: $full $dest"
              else
                case "$pr_err" in
                  *"already exists"*) echo "pr-exists: $full $dest" ;;
                  *) echo "::warning::fleet: pr-create failed for $full $dest: $pr_err" ;;
                esac
              fi
            done

            # 2) fan out the tracker-write PAT the stub needs (idempotent overwrite)
            if [ -n "${WRITE_PAT:-}" ]; then
              if [ "$DRY" = "true" ]; then
                echo "would-set-secrets: $full (PROJECTS_WRITE_PAT)"
              else
                if printf '%s' "$WRITE_PAT" | gh secret set PROJECTS_WRITE_PAT --repo "$full"; then
                  echo "secrets-set: $full"
                else
                  echo "::warning::fleet: secret fan-out failed for $full"
                fi
              fi
            else
              echo "::warning::PROJECTS_WRITE_PAT not set on .github; skipping secret fan-out for $full"
            fi
          done

          echo "done: $changed file change(s); dry-run=$DRY across ${#REPOS[@]} repo(s)"

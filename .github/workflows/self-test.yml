          # to run. (Herestring, not a pipe: `printf … | grep -q` under pipefail
          # is the SIGPIPE false-negative this repo keeps a guard case for.)
          if [ -d actions/swift-bite ] && ! grep -q '^FAIL - ' <<<"$out"; then
            echo "::error::the table exited $rc against the pre-change gate but named no failing case — that is an environment error, not a bite."
            exit 1
          fi
          echo "::notice::the gate's own tests bite"

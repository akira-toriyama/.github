name: self test

# The hub tests its OWN Actions plumbing. Its reusable workflows (release.yml,
# taplo.yml, swift-format.yml, design-md-lint.yml, update-tap.yml, fleet-sync.yml)
# and the actions/swift-build composite are consumed fleet-wide via @v1, but
# until this workflow existed a change to any of them could merge GREEN WITHOUT
# EVER RUNNING — the break surfaced only when the v1 tag moved (or, for
# fleet-sync, the next scheduled run), by which point every caller already had
# it. Three kinds of check close that gap, cheapest-first:
#
#   actionlint  — static-lints the hub's own workflow files (YAML / expression /
#                 shellcheck). It bundles shellcheck for `run:` blocks and
#                 validates local `uses: ./...` references, so a change under
#                 actions/ is covered too (that is why actions/** is in the path
#                 filter — the composite itself is not a workflow file, but the
#                 workflows that consume it are re-linted when it changes).
#   zizmor      — Actions-specific SECURITY lint (template injection, unpinned
#                 third-party actions, over-broad permissions, …) over the same
#                 files, as a hard PR gate. Overlaps but doesn't subsume the CodeQL
#                 "actions" scan (scripts/apply-repo-settings.sh, t-1f6y): CodeQL is
#                 the deeper dataflow analysis feeding the Security tab; this is the
#                 fast, Actions-focused gate. Policy/threshold: .github/zizmor.yml.
#   smoke-*     — actually RUN three of the reusables (taplo, design-md-lint,
#                 swift-format) via `uses: ./` against a tiny fixture, so a break in
#                 the reusable's own runtime (bad tool invocation, input handling)
#                 fails HERE, not in a caller after the tag moves — the lint jobs
#                 only check the YAML, these exercise execution. release/update-tap/
#                 fleet-sync stay lint-only: a runtime smoke needs a heavy fixture
#                 (fake app / tap / fleet), deliberately out of scope. And because
#                 the reusables skip-pass on a missing path, smoke-fixtures-present
#                 guards against a moved fixture turning a smoke vacuously green.
#
# Precondition (t-h0sc): the two intentional word-splits carry line-scoped
# `# shellcheck disable=SC2086` (added in the workflow-hygiene batch t-zb2r), so
# actionlint exits 0 on a clean tree and this can act as a gate.
#
# NOTE — required checks: this is path-filtered, so GitHub leaves it "pending"
# on PRs that touch none of the filtered paths. Do NOT add these jobs to
# branch-protection required checks while filtered (an unrelated PR would wedge
# on a check that never runs). Drop the `paths:` filter to make it required-safe.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # The zizmor gate's own policy lives here, NOT under workflows/ — a change to
      # it must re-run the gate, or a policy loosening could merge unexercised.
      - '.github/zizmor.yml'
      - 'actions/**'
      # Fixture edits (and deletions) must re-run the smoke jobs — a malformed or
      # moved fixture is exactly what should trip the gate.
      - 'tests/fixtures/**'
      # smoke-taplo lints the WHOLE repo (taplo.yml has no path input), so any
      # *.toml change should re-run it — an unclean file then fails on ITS OWN PR
      # rather than being admitted silently and reddening a later unrelated one.
      - '**/*.toml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # actionlint over ~10 small workflows is sub-second; bound it anyway (house rule).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Lint-only, never pushes — drop the persisted checkout token (zizmor
          # artipacked); nothing downstream needs it. t-2nh8
          persist-credentials: false

      # rhysd/actionlint ships no first-party action, so pin the release binary
      # and SHA256-verify it before running — the same "trust nothing mutable"
      # posture the third-party `uses:` steps get from SHA pins, applied to a
      # downloaded tool. Bump VERSION and SHA256 together (the hash lives in the
      # release's actionlint_<version>_checksums.txt). Dependabot does not track
      # this pin.
      - name: Run actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          curl --fail --silent --show-error --location "$url" -o "$tarball"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          # ubuntu-latest ships shellcheck and actionlint auto-detects it; if a
          # future runner image drops it, actionlint would SILENTLY skip its
          # run:-block checks — fail loud instead of quietly losing that coverage.
          command -v shellcheck >/dev/null \
            || { echo "::error::shellcheck not on runner — actionlint would skip run: checks"; exit 1; }
          ./actionlint -color

  # Actions-specific security lint as a HARD PR gate. This DOGFOODS the reusable the
  # hub distributes to the fleet (zizmor.yml, t-qbp1): calling it via `uses: ./`
  # exercises it at PR time, so a break in the reusable fails HERE, not in a fleet
  # caller after @v1 moves — the same guarantee the taplo/design-md/swift-format
  # smokes below give, applied to the hub's own security gate. The gate's mechanics
  # (exit-code propagation, no SARIF, deterministic offline audits, pinned version)
  # live in .github/workflows/zizmor.yml; the policy in .github/zizmor.yml. Only
  # the hub scans `actions` too (its composite); fleet callers take the reusable's
  # `.github/workflows` default.
  zizmor:
    uses: ./.github/workflows/zizmor.yml
    with:
      inputs: .github/workflows actions
      # Stricter than the fleet default (medium): every hub checkout is now
      # explicit about persist-credentials (t-2nh8), so the low-confidence
      # artipacked findings the medium floor existed to drop are gone — low
      # keeps artipacked ALWAYS gated on new checkouts here. Fleet callers
      # stay at medium until re-audited at low. Waive a genuine low-confidence
      # false positive inline with `# zizmor: ignore[rule]`.
      min-confidence: low

  # Guard against a vacuously-green smoke: design-md-lint and swift-format both
  # `exit 0` with a `::notice::` when their input path is absent (intentional, for
  # their real callers), and taplo lints nothing if its fixture is gone — so a
  # moved/renamed/deleted fixture would let a smoke pass WITHOUT exercising its
  # tool, silently losing coverage. Fail loud here instead. tests/fixtures/** is in
  # the path filter, so a PR that removes a fixture runs this and goes red.
  smoke-fixtures-present:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Only stats fixture files — never pushes; drop the persisted checkout
          # token (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Assert smoke fixtures exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            tests/fixtures/taplo/valid.toml \
            tests/fixtures/design/DESIGN.md \
            tests/fixtures/swift/Fixture.swift; do
            # -s (non-empty), not just -f: an emptied fixture is as vacuous as a
            # missing one — taplo/design-md/swift-format would all no-op-pass on it.
            if [ ! -s "$f" ]; then
              echo "::error::smoke fixture missing or empty: $f — a smoke would pass vacuously without it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all smoke fixtures present"

  # Reusable smoke tests — RUN each of the three cheap/deterministic reusables via
  # `uses: ./` against its fixture so a break in the reusable's own runtime (bad
  # tool call, input handling) fails here at PR time, not in a caller after the v1
  # tag moves. Each fixture is kept tool-clean and documents its contract under
  # tests/fixtures/ (existence enforced by smoke-fixtures-present above).
  smoke-taplo:
    # taplo.yml takes no path input — it lints the whole checked-out repo, so the
    # fixture at tests/fixtures/taplo/ is the one *.toml it finds today. That means
    # this job doubles as a repo-wide taplo(-fmt) gate: a red here on some OTHER
    # *.toml is a real unclean-TOML failure, not a reusable regression (the
    # '**/*.toml' path trigger above makes it fire on the PR that adds it).
    uses: ./.github/workflows/taplo.yml

  smoke-design-md-lint:
    uses: ./.github/workflows/design-md-lint.yml
    with:
      paths: tests/fixtures/design/DESIGN.md

  smoke-swift-format:
    # Runs on macOS (the reusable pins Xcode) — the one non-linux job here. `swift
    # format lint` doesn't compile, so it's fast; bounded by the reusable's timeout.
    uses: ./.github/workflows/swift-format.yml
    with:
      paths: tests/fixtures/swift

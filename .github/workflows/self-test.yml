name: self test

# The hub tests its OWN Actions plumbing. Its reusable workflows and composite
# actions — indexed in README.md, not re-listed here, because the copy that used
# to be here named fleet-sync.yml (which is not a reusable and is consumed by
# nobody) and omitted four that are — ship fleet-wide via @v2. Until this workflow
# existed a change to any of them could merge GREEN WITHOUT EVER RUNNING; the
# break surfaced only when the moving major tag moved, by which point every caller
# already had it. fleet-sync.yml is here for the same reason by a different route:
# it is not consumed, but it runs on a daily schedule against every repo, so its
# first execution after a merge is already fleet-wide.
#
# Four kinds of check close that gap, cheapest-first:
#
#   actionlint  — static-lints the hub's own workflow files (YAML / expression /
#                 shellcheck). It bundles shellcheck for `run:` blocks and
#                 validates local `uses: ./...` references, so a change under
#                 actions/ is covered too (that is why actions/** is in the path
#                 filter — the composite itself is not a workflow file, but the
#                 workflows that consume it are re-linted when it changes).
#   zizmor      — Actions-specific SECURITY lint (template injection, unpinned
#                 third-party actions, over-broad permissions, …) over the same
#                 files, as a hard PR gate. Overlaps but doesn't subsume the CodeQL
#                 "actions" scan (scripts/apply-repo-settings.sh, t-1f6y): CodeQL is
#                 the deeper dataflow analysis feeding the Security tab; this is the
#                 fast, Actions-focused gate. Policy/threshold: .github/zizmor.yml.
#   smoke-*     — actually RUN the reusables/actions against tiny fixtures, so a
#                 break in their own runtime (bad tool call, input handling) fails
#                 HERE, not in a caller after the tag moves — the lint jobs only
#                 check the YAML, these exercise execution. taplo / design-md-lint /
#                 swift-format run via `uses: ./`. update-tap's formula-mutation
#                 half (actions/bump-formula) is EXTRACTED into a composite and
#                 table-tested: bump-formula-test runs the real .sh over a case
#                 table, bump-formula-smoke runs the composite wrapper once.
#                 Its I/O half — the tap git push — and fleet-sync stay lint-only:
#                 a runtime smoke there needs a heavy fixture (fake tap / fleet),
#                 deliberately out of scope. And because a reusable skip-passes on
#                 a missing path, smoke-fixtures-present guards against a moved
#                 fixture turning a smoke vacuously green.
#   *-test        — table tests over the logic EXTRACTED out of `run:` blocks
#                   (tests/*.test.sh), plus the hub's own bookkeeping invariants
#                   (fleet-manifest-test). Extraction is what made that logic
#                   testable; it also moved it out of actionlint's reach, so the
#                   shellcheck step above covers scripts/, actions/ and tests/
#                   directly. posix-portability re-runs the pure-shell tables on
#                   macOS, because the author's machine is the one place these
#                   have to be debuggable by hand.
#
# Precondition (t-h0sc): the two intentional word-splits carry line-scoped
# `# shellcheck disable=SC2086` (added in the workflow-hygiene batch t-zb2r), so
# actionlint exits 0 on a clean tree and this can act as a gate.
#
# NOTE — required checks: this is path-filtered, so GitHub leaves it "pending"
# on PRs that touch none of the filtered paths. Do NOT add these jobs to
# branch-protection required checks while filtered (an unrelated PR would wedge
# on a check that never runs). Drop the `paths:` filter to make it required-safe.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # The zizmor gate's own policy lives here, NOT under workflows/ — a change to
      # it must re-run the gate, or a policy loosening could merge unexercised. The
      # actionlint config is the same shape of thing: an added `ignore` must be
      # exercised by the lint job on its own pull request.
      - '.github/zizmor.yml'
      - '.github/actionlint.yaml'
      - 'actions/**'
      # Fixture edits/deletions AND the extracted test scripts (tests/*.test.sh)
      # must re-run the smoke/unit jobs — a malformed or moved fixture, or an
      # edited test, is exactly what should trip the gate.
      - 'tests/**'
      # Logic extracted OUT of a workflow keeps its gate. glyph-pin-scan.sh is
      # what glyph-pin-audit.yml sees the whole fleet through, and actionlint
      # does not read scripts/ — without this line an edit to it would merge
      # unexercised, which is the exact hole this workflow exists to close.
      - 'scripts/**'
      # The canonical files fleet-sync distributes. They are complete workflows
      # bound for every owned repo, yet nothing here used to look at them: actionlint's
      # no-argument default is `.github/workflows/**`, and this filter did not
      # name them either — so a syntax error in one could merge and ship. They
      # are also what fleet-manifest.test.sh and apply-repo-settings.test.sh read
      # as their source of truth, so an edit here must re-run those.
      - 'fleet/**'
      # smoke-taplo lints the WHOLE repo (taplo.yml has no path input), so any
      # *.toml change should re-run it — an unclean file then fails on ITS OWN PR
      # rather than being admitted silently and reddening a later unrelated one.
      - '**/*.toml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # actionlint over ~10 small workflows is sub-second; bound it anyway (house rule).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Lint-only, never pushes — drop the persisted checkout token (zizmor
          # artipacked); nothing downstream needs it. t-2nh8
          persist-credentials: false

      # rhysd/actionlint ships no first-party action, so pin the release binary
      # and SHA256-verify it before running — the same "trust nothing mutable"
      # posture the third-party `uses:` steps get from SHA pins, applied to a
      # downloaded tool. Bump VERSION and SHA256 together (the hash lives in the
      # release's actionlint_<version>_checksums.txt). Dependabot does not track
      # this pin.
      - name: Run actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          curl --fail --silent --show-error --location "$url" -o "$tarball"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          # ubuntu-latest ships shellcheck and actionlint auto-detects it; if a
          # future runner image drops it, actionlint would SILENTLY skip its
          # run:-block checks — fail loud instead of quietly losing that coverage.
          command -v shellcheck >/dev/null \
            || { echo "::error::shellcheck not on runner — actionlint would skip run: checks"; exit 1; }
          ./actionlint -color
          # The fleet canonicals are complete workflows bound for every repo, but
          # they live under fleet/ and actionlint's no-argument default only walks
          # `.github/workflows/**` — so until this line they were the least-linted
          # workflow files in the repo and the most widely distributed. Named
          # explicitly rather than globbed: fleet/dependabot.yml and
          # fleet/zizmor-config.yml are configs, not workflows, and actionlint
          # syntax-errors on them.
          ./actionlint -color \
            fleet/commit-lint.yml \
            fleet/task-status.yml \
            fleet/taplo.yml \
            fleet/version-preview.yml \
            fleet/zizmor.yml

      # Standalone shell scripts are NOT covered by the actionlint run above:
      # actionlint shellchecks `run:` blocks inside workflow files and never opens
      # scripts/ or tests/. Extracting logic out of a `run:` block to make it
      # testable therefore silently dropped it out of shellcheck's reach — and
      # that is where the fleet-mutating code now lives.
      - name: Shellcheck the standalone scripts
        run: |
          set -euo pipefail
          shellcheck --shell=bash \
            scripts/*.sh \
            actions/*/*.sh \
            tests/*.test.sh

  # Actions-specific security lint as a HARD PR gate. This DOGFOODS the reusable the
  # hub distributes to the fleet (zizmor.yml, t-qbp1): calling it via `uses: ./`
  # exercises it at PR time, so a break in the reusable fails HERE, not in a fleet
  # caller after @v2 moves — the same guarantee the taplo/design-md/swift-format
  # smokes below give, applied to the hub's own security gate. The gate's mechanics
  # (exit-code propagation, no SARIF, deterministic offline audits, pinned version)
  # live in .github/workflows/zizmor.yml; the policy in .github/zizmor.yml. Only
  # the hub scans `actions` too (its composite); fleet callers take the reusable's
  # `.github/workflows` default.
  zizmor:
    uses: ./.github/workflows/zizmor.yml
    with:
      inputs: .github/workflows actions
      # No `min-confidence:` on purpose — the hub takes the reusable's default,
      # which is `low` since t-yaxa flipped it (the hub itself went explicit
      # about persist-credentials in t-2nh8; the fleet followed). Restating the
      # value here would duplicate house policy in a second place AND leave the
      # default itself untested — inheriting it makes this self-test the
      # regression test for the floor every fleet caller actually gets. Waive a
      # genuine low-confidence false positive inline with `# zizmor: ignore[rule]`
      # rather than raising the floor.

  # Guard against a vacuously-green smoke: design-md-lint and swift-format both
  # `exit 0` with a `::notice::` when their input path is absent (intentional, for
  # their real callers), and taplo lints nothing if its fixture is gone — so a
  # moved/renamed/deleted fixture would let a smoke pass WITHOUT exercising its
  # tool, silently losing coverage. Fail loud here instead. tests/fixtures/** is in
  # the path filter, so a PR that removes a fixture runs this and goes red.
  smoke-fixtures-present:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Only stats fixture files — never pushes; drop the persisted checkout
          # token (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Assert smoke fixtures exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            tests/fixtures/taplo/valid.toml \
            tests/fixtures/design/DESIGN.md \
            tests/fixtures/swift/Fixture.swift \
            tests/fixtures/tap/plain.rb \
            tests/fixtures/tap/with-resource.rb \
            tests/fixtures/tap/with-own-resource.rb \
            tests/fixtures/tap/with-revision.rb \
            tests/fixtures/tap/with-head.rb \
            tests/fixtures/tap/double-digit-minor.rb \
            tests/fixtures/tap/mismatched-url.rb; do
            # -s (non-empty), not just -f: an emptied fixture is as vacuous as a
            # missing one — taplo/design-md/swift-format would all no-op-pass on it.
            if [ ! -s "$f" ]; then
              echo "::error::smoke fixture missing or empty: $f — a smoke would pass vacuously without it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all smoke fixtures present"

  # Reusable smoke tests — RUN each of the three cheap/deterministic reusables via
  # `uses: ./` against its fixture so a break in the reusable's own runtime (bad
  # tool call, input handling) fails here at PR time, not in a caller after the
  # moving `v2` tag moves (`v1` is frozen and must never move). Each fixture is
  # kept tool-clean and documents its contract under
  # tests/fixtures/ (existence enforced by smoke-fixtures-present above).
  smoke-taplo:
    # taplo.yml takes no path input — it lints the whole checked-out repo, so the
    # fixture at tests/fixtures/taplo/ is the one *.toml it finds today. That means
    # this job doubles as a repo-wide taplo(-fmt) gate: a red here on some OTHER
    # *.toml is a real unclean-TOML failure, not a reusable regression (the
    # '**/*.toml' path trigger above makes it fire on the PR that adds it).
    uses: ./.github/workflows/taplo.yml

  smoke-design-md-lint:
    uses: ./.github/workflows/design-md-lint.yml
    with:
      paths: tests/fixtures/design/DESIGN.md

  smoke-swift-format:
    # Runs on macOS (the reusable pins Xcode) — the one non-linux job here. `swift
    # format lint` doesn't compile, so it's fast; bounded by the reusable's timeout.
    uses: ./.github/workflows/swift-format.yml
    with:
      paths: tests/fixtures/swift

  # RUN the extracted formula-mutation logic over a case table (the real .sh,
  # drift-free) so a break fails HERE, not in a caller after @v2 moves. This is
  # the coverage #98 lacked — actionlint/zizmor never executed the sed, so the
  # resource-block-poisoning bug merged green.
  bump-formula-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Reads fixtures + runs the script; never pushes — drop the persisted
          # checkout token (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test bump-formula
        run: bash tests/bump-formula.test.sh

  # Exercise the composite WRAPPER (action.yml's input→env→arg mapping) once via
  # `uses: ./`, so a wrapper break fails here too — the table test above calls the
  # .sh directly and would miss it. Mutates the checked-out fixture copy in place.
  bump-formula-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the composite on a fixture
        uses: ./actions/bump-formula
        with:
          formula-path: tests/fixtures/tap/plain.rb
          tag: v2.0.0
          sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          repo: akira-toriyama/facet
          formula: facet
      # `allow-downgrade` is the one input the forward bump above never routes:
      # bump-formula.sh reads it only on a backward move, so deleting its line from
      # action.yml's env: block leaves this whole job green and breaks nothing but
      # production rollbacks. Roll the fixture back so every declared input travels
      # through the wrapper at least once.
      - name: Run the composite again, rolling back
        uses: ./actions/bump-formula
        with:
          formula-path: tests/fixtures/tap/plain.rb
          tag: v1.0.0
          sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          repo: akira-toriyama/facet
          formula: facet
          allow-downgrade: "true"
      # Assert something the script cannot assert about itself. Re-running its own
      # post-condition greps proves nothing: bump-formula.sh already exits 1 unless
      # they hold, so the composite step above fails first in every case this could
      # catch. That the FIXTURE CHANGED is the wrapper's own contract — it is what
      # goes wrong when action.yml stops mapping an input into the environment.
      - name: Assert the wrapper actually mutated the fixture
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/fixtures/tap/plain.rb; then
            echo "::error::the composite left tests/fixtures/tap/plain.rb untouched — the wrapper did not run the script"
            exit 1
          fi
          grep -q "github.com/akira-toriyama/facet/archive/refs/tags/v1.0.0.tar.gz" tests/fixtures/tap/plain.rb
          grep -q 'sha256 "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"' tests/fixtures/tap/plain.rb

  # RUN the pin extractor over a case table (the real .sh). glyph-pin-audit.yml
  # reads every workflow in every owned repo through this script, and it is the only
  # thing standing between "the fleet is level" and a lie — a parser regression
  # here does not fail loudly, it silently stops SEEING a pin, which is
  # indistinguishable from a level fleet. The table pins that distinction.
  glyph-pin-scan-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Feeds YAML to a script on stdin; never pushes (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test glyph-pin-scan
        run: bash tests/glyph-pin-scan.test.sh

  # RUN the pin REWRITER over a case table (the real .sh). The scan test above
  # guards what the fleet is SEEN through; this guards what it is WRITTEN with —
  # glyph-pin-rewrite.yml edits files in ~36 repos that the hub cannot
  # reconstruct, and every one of them is bespoke. Two of the cases are
  # mutations: they break the rewriter on purpose in a copy and require its own
  # refusals to fire, because a guard that only ever runs on correct input is
  # decoration and reads exactly like this file passing.
  glyph-pin-rewrite-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Feeds YAML to a script on stdin; never pushes (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test glyph-pin-rewrite
        run: bash tests/glyph-pin-rewrite.test.sh

  # RUN the rollout-ledger gate over a case table (the real .sh, stubbed gh).
  # fleet-sync refuses every apply run this gate does not allow, so a regression
  # here fails one of two ways: open (a staged change ships fleet-wide with no
  # canary behind it) or shut (the daily sync reddens until someone reads the
  # log). The table pins both directions, and its final case is a REAL-TREE
  # invariant: the repo's own fleet/rollout.json must cover the repo's own
  # fleet/ bytes — which is what makes "edit a canonical, forget the ledger"
  # fail on the PR that does it instead of in the next day's apply run.
  fleet-rollout-gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs the script against mktemp fixtures; never pushes (zizmor
          # artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test fleet-rollout-gate
        run: bash tests/fleet-rollout-gate.test.sh

  # RUN the bundled-commit writer over a case table (the real .sh, stubbed gh).
  # fleet-sync lands every repo's manifest diff through this script, and the
  # property it exists for — N changed files, ONE push — is invisible to
  # actionlint and zizmor: only executing it against a recording stub can
  # assert how many ref updates left the building (t-z7c1: each extra push
  # fires a release run, and stacked runs collided in bare 403s).
  fleet-commit-bundle-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Runs a script against a stubbed gh; never pushes (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test fleet-commit-bundle
        run: bash tests/fleet-commit-bundle.test.sh

  # RUN the covered-pull extractor over a case table (the real .sh).
  # glyph-covered-pull-audit.yml asserts an ABSENCE across every owned repo —
  # no bot-authored merge commit in any release window, no --merge/--rebase on
  # any `gh pr merge` — and an extractor that silently stops matching reads
  # exactly like a dormant trap. The table's arming shapes are the positive
  # controls that pin the difference.
  covered-pull-scan-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Feeds TSV/YAML to a script on stdin; never pushes (zizmor artipacked). t-2nh8
          persist-credentials: false
      - name: Table-test covered-pull-scan
        run: bash tests/covered-pull-scan.test.sh

  # The hub's own bookkeeping, which until now lived only in prose: that every
  # MANIFEST src exists, that no dest collides with a glyph reusable definition,
  # that every canonical is both distributed AND documented, that dependabot.d
  # blocks and their probe pairs agree, and that the hand-maintained
  # .github/workflows/task-status.yml still matches fleet/task-status.yml below
  # the provenance header. fleet-sync EXCLUDEs `.github`, so nothing will ever
  # reconcile that last pair on its own — CLAUDE.md said "nothing in CI guards
  # this", and this job is that guard.
  fleet-manifest-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the fleet manifest invariants
        run: bash tests/fleet-manifest.test.sh

  # RUN the fleet-wide settings script against a stubbed `gh`. It is the only
  # thing here that mutates state across every repo, it had no test at all, and
  # its branch-protection detector spent two weeks matching zero repos while
  # exiting 0. The table seeds its caller fixture FROM fleet/commit-lint.yml, so a
  # future repoint of the canonical cannot silently disarm the detector again.
  apply-repo-settings-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Table-test apply-repo-settings
        run: bash tests/apply-repo-settings.test.sh

  # The same pure-shell tables again, on macOS. (This comment used to say "three"
  # while the step below ran four — a hand-kept count in prose next to the list it
  # counts.) Not redundancy: the author's
  # machine is macOS with a BSD userland, so a GNU-only construct here means the
  # only local way to see this logic run is unavailable exactly when it is needed.
  # That was not hypothetical — bump-formula.sh used GNU `sed -i` with the
  # `0,/re/` address and its table failed 5 of 8 cases locally while passing in
  # CI, so the one check that could catch a formula-mutation bug before it reached
  # a tap could not be run by the person writing the change. Cheap: all three are
  # sub-second, and go-bite (which needs Go and builds throwaway repos) stays
  # linux-only.
  posix-portability:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Record what was actually exercised. macOS ships bash 3.2 (the last GPLv2
      # release) as /bin/bash, which is both the point of this job and easy to lose
      # silently if a future runner image puts a newer bash first in PATH — at
      # which point this would keep passing while covering nothing.
      - name: Show the interpreter and userland under test
        run: |
          set -euo pipefail
          bash --version | head -1
          sed --version 2>/dev/null | head -1 || echo "sed: BSD (no --version)"
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1 || true
      - name: The shell tables must pass on a BSD userland too
        run: |
          set -euo pipefail
          bash tests/bump-formula.test.sh
          bash tests/glyph-pin-scan.test.sh
          bash tests/glyph-pin-rewrite.test.sh
          bash tests/covered-pull-scan.test.sh
          bash tests/fleet-commit-bundle.test.sh
          bash tests/fleet-manifest.test.sh
          bash tests/fleet-rollout-gate.test.sh
          bash tests/apply-repo-settings.test.sh

  # RUN the go-bite gate over a case table (the real .sh) so a break fails HERE, not
  # in a fleet caller after @v2 moves. Each case builds a throwaway Go repo under
  # mktemp with `git init`, so there is no fixture to keep in sync — and no
  # smoke-fixtures-present entry to add.
  go-bite-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Builds its own repos under mktemp; never pushes (zizmor artipacked). t-2nh8
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Table-test go-bite
        run: bash tests/go-bite.test.sh

  # swift-bite's table needs what the gate itself needs: a macOS runner whose
  # toolchain can RUN XCTest and swift-testing (Command Line Tools can do
  # neither, which is why the table has a loud scan-only mode for local use —
  # never here).
  swift-bite-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # Builds its own repos under mktemp; never pushes (zizmor artipacked).
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Table-test swift-bite
        run: bash tests/swift-bite.test.sh

  # The gate applied to itself. go-bite refuses a pull request whose new tests pass
  # against the pre-change source; this job holds the gate's OWN table test to that
  # standard — it runs the post-change table against the PRE-change script and
  # requires it to FAIL. A change to go-bite that no case pins would otherwise merge
  # green and surface only in a caller after @v2 moves, which is exactly the failure
  # the gate exists to stop.
  #
  # A pull request that leaves both the script and its table alone skips this; a
  # change with genuinely nothing to pin says so with the same `Bite-exempt:` commit
  # footer the gate itself honours.
  go-bite-self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs the merge base to reconstruct the pre-change gate.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: The gate's own tests must bite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          before="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" \
            || { echo "::error::no merge base for $BASE_SHA..$HEAD_SHA — cannot reconstruct the pre-change gate"; exit 1; }
          [ -n "$before" ] \
            || { echo "::error::empty merge base — cannot reconstruct the pre-change gate"; exit 1; }
          if git diff --quiet "$before" "$HEAD_SHA" -- actions/go-bite tests/go-bite.test.sh; then
            echo "::notice::go-bite itself is untouched — nothing to prove"
            exit 0
          fi

          # Parse the waiver EXACTLY as the gate parses it: a real git trailer, on
          # EVERY commit in the range. The `git log | sed -n 's/^Bite-exempt:…//p'`
          # this replaces accepted a bare line anywhere in any ONE commit message —
          # which is precisely the shape tests/go-bite.test.sh pins as a NON-waiver.
          # The gate guarding the gate was the easier of the two to walk past.
          waiver=""
          waived=0
          commits="$(git rev-list --no-merges "$before..$HEAD_SHA")"
          if [ -n "$commits" ]; then
            waived=1
            for commit in $commits; do
              # `{ grep || true; }`: this inline copy runs under the runner's
              # injected `bash -e`, where pipefail turns grep's no-match exit 1
              # into a SILENT job failure before the table ever runs (the gate
              # script itself is immune — it runs in its own bash without -e).
              line="$(git show -s --format=%B "$commit" | git interpret-trailers --parse | { grep '^Bite-exempt:' || true; } | sed -n '1p')"
              if [ -z "$line" ]; then waived=0; break; fi
              waiver="$(printf '%s' "${line#Bite-exempt:}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            done
          fi
          if [ "$waived" -eq 1 ] && [ -n "$waiver" ]; then
            echo "::notice::waived by a Bite-exempt trailer on every commit — $waiver"
            exit 0
          fi

          # Reconstruct the pre-change gate. A brand-new gate has no pre-change
          # version at all — a distinct, expected case, asked about directly rather
          # than inferred from a failed checkout. The blanket `|| rm -rf` this
          # replaces fired on ANY checkout error, so an unresolvable ref deleted the
          # gate and the resulting abort was then reported as proof that it bites.
          if git cat-file -e "$before:actions/go-bite/go-bite.sh" 2>/dev/null; then
            git checkout "$before" -- actions/go-bite \
              || { echo "::error::could not restore actions/go-bite at $before"; exit 1; }
          else
            echo "::notice::no gate at $before — a brand-new gate could not have passed before, by definition"
            rm -rf actions/go-bite
          fi

          # `|| rc=$?`, never a bare `; rc=$?`: the table FAILING here is the
          # expected outcome, and under the runner's injected `bash -e` a plain
          # assignment from a failing substitution kills the job on that very
          # line — before the verdict logic below ever runs.
          rc=0
          out="$(bash tests/go-bite.test.sh 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the go-bite table passes against the PRE-CHANGE gate — the new cases pin nothing. Add a case that fails without this change, or waive it with a \`Bite-exempt: <reason>\` commit trailer on every commit."
            exit 1
          fi
          # Non-zero alone is not evidence: the harness also aborts non-zero on a
          # missing script or a broken environment. Require a NAMED failing case —
          # except on the brand-new-gate path, where there is no script to run.
          # (Herestring, not a pipe: `printf … | grep -q` under pipefail is the
          # SIGPIPE false-negative this repo keeps a dedicated guard case for.)
          if [ -d actions/go-bite ] && ! grep -q '^FAIL - ' <<<"$out"; then
            echo "::error::the table exited $rc against the pre-change gate but named no failing case — that is an environment error, not a bite."
            exit 1
          fi
          echo "::notice::the gate's own tests bite"

  # The same standard for the Swift gate: the post-change table must FAIL

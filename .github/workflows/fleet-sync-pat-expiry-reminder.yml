name: fleet-sync-pat-expiry-reminder

# Auto-files a furrow task when FLEET_SYNC_PAT (the classic PAT — scopes `repo` +
# `workflow` — that fleet-sync uses to standardize files and fan out secrets across
# the fleet) is within EXPIRY_WARN_DAYS of expiring. FLEET_SYNC_PAT is the
# widest-privilege secret in the system (classic, cross-repo write, workflow scope),
# so a silent expiry would freeze the whole fleet-sync engine. Generating/rotating
# the PAT is GitHub-UI only (not automatable) — this just makes sure the reminder is
# never forgotten. Sibling of the projects repo's pat-expiry-reminder.yml (which
# watches the fine-grained PROJECTS_WRITE_PAT).
#
# Expiry is read from the `GitHub-Authentication-Token-Expiration` response header
# returned for PAT-authenticated REST calls. A classic PAT with NO expiry returns no
# header, so the calendar path stays QUIET until FLEET_SYNC_PAT is reissued WITH an
# expiry — which is the point of the security task (a non-expiring master token is
# the risk). The liveness path is always armed: a 401 files immediately, because a
# revoked/expired PAT means fleet-sync is frozen NOW (t-v2zf: the inline probe used
# to read 401 as "transient?" and would have stayed silent forever). Runs weekly;
# files a task ONLY when the PAT is dead or expiring soon AND no open rotation task
# exists (no duplicates; a delayed/skipped tick is recovered next week, inside the
# warning window).
#
# It reads its own expiry with FLEET_SYNC_PAT but writes the reminder task to the
# furrow tracker (akira-toriyama/projects) with PROJECTS_WRITE_PAT — both secrets
# already live on this repo. No write to .github itself, so contents: read suffices.

on:
  schedule:
    - cron: '0 9 * * 1' # 09:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-sync-pat-expiry-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    # Bounded so a hung API probe or tracker push can't idle a runner for hours.
    timeout-minutes: 10
    env:
      EXPIRY_WARN_DAYS: '30'
      MARKER: 'FLEET_SYNC_PAT'
    steps:
      - name: Gate — both PATs present?
        id: gate
        env:
          FLEET_PAT: ${{ secrets.FLEET_SYNC_PAT }}
          WRITE_PAT: ${{ secrets.PROJECTS_WRITE_PAT }}
        run: |
          set -euo pipefail
          # FLEET_SYNC_PAT: the token whose expiry we watch. PROJECTS_WRITE_PAT: how
          # we write the reminder to the tracker. Missing either -> dormant.
          if [ -z "${FLEET_PAT:-}" ] || [ -z "${WRITE_PAT:-}" ]; then
            echo "::notice::FLEET_SYNC_PAT or PROJECTS_WRITE_PAT not set — reminder dormant until both configured."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the hub (for scripts/token-expiry-probe.sh)
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          # Read-only: this job writes to the TRACKER, never back to the hub.
          persist-credentials: false

      - name: Probe the API with the PAT (liveness + expiry header)
        id: expiry
        if: steps.gate.outputs.proceed == 'true'
        env:
          FLEET_PAT: ${{ secrets.FLEET_SYNC_PAT }}
        run: |
          set -euo pipefail
          # curl (not `gh api`) so the HTTP status is separable from transport
          # failure: `gh api` exits non-zero for a network hiccup AND for a 401,
          # and this step used to read any non-zero as "transient?" — so a
          # revoked FLEET_SYNC_PAT would have stayed silent every week while
          # fleet-sync sat frozen (t-v2zf).
          code="$(curl -sS -o /dev/null -D "$RUNNER_TEMP/hdrs" -w '%{http_code}' \
            -H "Authorization: Bearer $FLEET_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit || echo 000)"
          # The DECISION lives in a script so it is reachable from a test: the
          # 401 liveness branch only ever fires in production when a real token
          # is really dead, so inline it ships unexecuted (t-j72g). The curl
          # stays here — only what the probe SAW is portable to a table test.
          bash scripts/token-expiry-probe.sh "$code" "$RUNNER_TEMP/hdrs" > "$RUNNER_TEMP/probe.out"
          grep -vE '^reason=' "$RUNNER_TEMP/probe.out" >> "$GITHUB_OUTPUT"
          reason="$(sed -n 's/^reason=//p' "$RUNNER_TEMP/probe.out")"
          # Annotate from the step itself so the workflow command is definitely
          # on the runner's stdout, and so the script stays a pure decision.
          if grep -qx 'kind=dead' "$RUNNER_TEMP/probe.out"; then
            echo "::warning::FLEET_SYNC_PAT $reason"
          else
            echo "::notice::FLEET_SYNC_PAT $reason"
          fi

      - name: Checkout the furrow tracker
        if: steps.expiry.outputs.due == 'true'
        uses: actions/checkout@v7
        with:
          repository: akira-toriyama/projects
          token: ${{ secrets.PROJECTS_WRITE_PAT }}
          path: tracker
          fetch-depth: 0
          # The filing step runs plain `git push origin HEAD:main` (with
          # pull-rebase retries) against this checkout, so the PAT must stay
          # configured — explicit true marks the persistence as intentional
          # (zizmor artipacked stays silent on an explicit opt-in). checkout
          # v6+ keeps the credential under $RUNNER_TEMP, outside the workdir,
          # and this job uploads no artifacts. t-2nh8
          persist-credentials: true

      - name: Install furrow (pinned release binary)
        if: steps.expiry.outputs.due == 'true'
        env:
          # NOT `go install`: furrow's module path carries no /vN suffix, so Go
          # refuses source installs of every v2+ tag ("module path must match
          # major version" — measured, t-22cf). Because this step is gated on
          # `due`, that failure would have first fired on the exact day the
          # reminder mattered. The release tarball is how the fleet's own
          # sync-task-status gate installs furrow; checksum-pinned here
          # (ridge#13 shape). FURROW_RELEASE is the one furrow pin in this
          # file — the shell parses the version out of it, and
          # tests/fleet-manifest.test.sh §8 holds it in lockstep with the
          # other call sites.
          FURROW_RELEASE: akira-toriyama/furrow@v5.0.0
          FURROW_SHA256: 64d9e30c5258188f25e40ceb85685bcf038d20d297374b6226164bf6c307f395
        run: |
          set -euo pipefail
          ver="${FURROW_RELEASE#*@}"
          curl -fsSL --retry 3 -o /tmp/furrow.tgz \
            "https://github.com/${FURROW_RELEASE%@*}/releases/download/${ver}/furrow_${ver#v}_linux_amd64.tar.gz"
          echo "${FURROW_SHA256}  /tmp/furrow.tgz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/furrow.tgz furrow
          sudo install -m 0755 /tmp/furrow /usr/local/bin/furrow
          furrow --help >/dev/null

      - name: File a rotation reminder if none is open
        if: steps.expiry.outputs.due == 'true'
        working-directory: tracker
        env:
          KIND: ${{ steps.expiry.outputs.kind }}
          DAYS: ${{ steps.expiry.outputs.days }}
        run: |
          set -euo pipefail
          tasks="$(furrow ls -l security --json || echo '[]')"

          # Already an open (not-done) FLEET_SYNC_PAT-rotation task? -> nothing to do.
          open="$(printf '%s' "$tasks" | jq --arg m "$MARKER" \
            '[.[] | select(.status != "done" and (.title | contains($m)))] | length')"
          if [ "$open" -gt 0 ]; then
            echo "open FLEET_SYNC_PAT-rotation task exists — skip"; exit 0
          fi

          if [ "$KIND" = "dead" ]; then
            title="${MARKER} を更新（401 検知 — fleet-sync が今止まっている）"
            headline='fleet-sync が全 repo の標準ファイル配布 + secret fan-out に使う classic PAT (scopes repo + workflow) が 401 を返している（失効/取り消し済み）。**standard-file 同期も PAT fan-out も今止まっている**ため即ローテーションする。'
          else
            title="${MARKER} を更新（失効 ${DAYS} 日前）"
            headline="fleet-sync が全 repo の標準ファイル配布 + secret fan-out に使う classic PAT (scopes repo + workflow) があと約 ${DAYS} 日で失効する。失効すると fleet-sync が全 repo で静かに止まる（standard-file 同期も PAT fan-out も）ため、期限内にローテーションする。"
          fi

          body="$(printf '%s\n' \
            "# ${title}" '' \
            "$headline" '' \
            '1. 新しい classic PAT を作成（scope: **repo + workflow**・期限1年）' \
            '2. akira-toriyama/.github の secret **FLEET_SYNC_PAT** を更新' \
            '3. fleet-sync を workflow_dispatch (dry-run) で実行して疎通確認' \
            '4. 旧 PAT を **失効/削除**（GitHub Settings → Developer settings → Tokens (classic)）' '' \
            '監査: Tokens (classic) 一覧の有効期限。' '' \
            '(このタスクは .github の fleet-sync-pat-expiry-reminder workflow が自動起票。)')"

          furrow add "$title" -s ready -l shared -l security --body "$body"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m ':card_file_box:(tracker) auto-file FLEET_SYNC_PAT expiry reminder'
          # Match sync-task-status / pat-expiry-reminder: rebase-retry so a concurrent
          # push from another tracker writer doesn't drop this week's reminder.
          # Track success explicitly: the loop's last command is the (usually clean)
          # rebase, so a 3-loss fall-through would otherwise exit 0 and silently
          # drop the reminder.
          pushed=0
          for i in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; echo "pushed"; break; fi
            echo "push rejected (race); rebasing (attempt $i)"
            git pull --rebase origin main
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::tracker push failed after 3 attempts — reminder NOT filed; re-run this workflow."
            exit 1
          fi

name: sync-task-status

# Reusable workflow — apply `SetStatus-task:` directives from a PR to the furrow
# task tracker (akira-toriyama/projects). The brain lives here so the logic is
# maintained in one place; each code repo only needs a ~10-line caller stub:
#
#   # .github/workflows/task-status.yml in a code repo
#   name: task-status
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review, closed]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     sync:
#       uses: akira-toriyama/.github/.github/workflows/sync-task-status.yml@main
#       secrets: inherit
#
# Auth is a GitHub App (credential only — no server). Set its credentials as
# secrets on each calling repo (fleet-sync distributes them):
#   PROJECTS_APP_CLIENT_ID   (preferred) + PROJECTS_APP_PRIVATE_KEY
#   PROJECTS_APP_ID          (legacy fallback) + PROJECTS_APP_PRIVATE_KEY
# The App needs Contents: Read & write and must be installed on the tracker repo.
# Until a credential exists the workflow is DORMANT: it skips cleanly (green).
#
# A PR open (incl. draft) nudges the task to in-progress; a merge applies the
# directive's lane. Validation is NON-blocking: an invalid directive comments on
# the PR and fails THIS job, but never blocks the merge — keep it out of the
# repo's required checks.

on:
  workflow_call:
    inputs:
      tracker-owner:
        description: Owner of the furrow tracker repo.
        type: string
        default: akira-toriyama
      tracker-repo:
        description: Name of the furrow tracker repo to update.
        type: string
        default: projects
      open-lane:
        description: Lane a task is nudged to when a PR opens.
        type: string
        default: in-progress
      furrow-version:
        description: A go-installable furrow ref (tag, branch, commit, or `latest`).
        type: string
        default: latest
    secrets:
      PROJECTS_APP_CLIENT_ID:
        required: false
      PROJECTS_APP_ID:
        required: false
      PROJECTS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Gate — resolve event mode and App auth
        id: gate
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          CLIENT_ID: ${{ secrets.PROJECTS_APP_CLIENT_ID }}
          APP_ID: ${{ secrets.PROJECTS_APP_ID }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            opened|reopened|ready_for_review) mode=open ;;
            closed) if [ "$MERGED" = "true" ]; then mode=merge; else mode=skip; fi ;;
            *) mode=skip ;;
          esac
          # Prefer client-id (modern); fall back to app-id (deprecated but works).
          auth=none
          if [ -n "${CLIENT_ID:-}" ]; then auth=client
          elif [ -n "${APP_ID:-}" ]; then auth=app
          fi
          proceed=true
          [ "$mode" = skip ] && proceed=false
          if [ "$auth" = none ]; then
            proceed=false
            echo "::notice::No App credential (PROJECTS_APP_CLIENT_ID / PROJECTS_APP_ID) — task-status sync is dormant until configured."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION merged=$MERGED mode=$mode auth=$auth proceed=$proceed"

      - name: Mint a token (client-id)
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.auth == 'client'
        id: token-client
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROJECTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ inputs.tracker-owner }}
          repositories: ${{ inputs.tracker-repo }}

      - name: Mint a token (app-id fallback)
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.auth == 'app'
        id: token-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROJECTS_APP_ID }}
          private-key: ${{ secrets.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ inputs.tracker-owner }}
          repositories: ${{ inputs.tracker-repo }}

      - name: Checkout the tracker repo
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tracker-owner }}/${{ inputs.tracker-repo }}
          token: ${{ steps.token-client.outputs.token || steps.token-app.outputs.token }}
          path: tracker
          fetch-depth: 0

      - name: Set up Go
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install furrow
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          go install "github.com/akira-toriyama/furrow/cmd/furrow@${{ inputs.furrow-version }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Apply SetStatus-task directives
        if: steps.gate.outputs.proceed == 'true'
        id: apply
        working-directory: tracker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REF: ${{ github.event.repository.name }}#${{ github.event.pull_request.number }}
          MODE: ${{ steps.gate.outputs.mode }}
          OPEN_LANE: ${{ inputs.open-lane }}
        run: |
          set -uo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          furrow apply --on "$MODE" --ref "$REF" --open-lane "$OPEN_LANE" \
            --body-file /tmp/pr-body.txt --json > /tmp/apply.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo '--- furrow apply report ---'
          cat /tmp/apply.json || true
          {
            echo 'report<<FURROW_EOF'
            cat /tmp/apply.json 2>/dev/null || echo '{}'
            echo 'FURROW_EOF'
          } >> "$GITHUB_OUTPUT"
          # Never fail here: the dedicated step below sets the (non-blocking) job status.
          exit 0

      - name: Commit and push status changes
        if: steps.gate.outputs.proceed == 'true'
        working-directory: tracker
        env:
          REF: ${{ github.event.repository.name }}#${{ github.event.pull_request.number }}
          MODE: ${{ steps.gate.outputs.mode }}
          BOT: ${{ steps.token-client.outputs.app-slug || steps.token-app.outputs.app-slug }}
        run: |
          set -euo pipefail
          git config user.name  "${BOT}[bot]"
          git config user.email "${BOT}[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "no task changes to commit"
            exit 0
          fi
          git add -A
          git commit -q -m ":robot: chore(status): ${REF} ${MODE}"
          # Cross-repo pushes can race (GH concurrency groups are per-repo and
          # cannot serialize them), so rebase-retry like a human operator would.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected (race); rebasing (attempt $i)"
            git pull --rebase origin main
          done
          echo "push failed after retries"
          exit 1

      - name: Comment validation failures on the PR
        if: steps.gate.outputs.proceed == 'true' && steps.apply.outputs.code != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.apply.outputs.report }}
        with:
          script: |
            const report = (process.env.REPORT || '{}').trim();
            const body = [
              '⚠️ **furrow: one or more `SetStatus-task:` directives were invalid.**',
              'The merge is **not** blocked; the affected task status was left unchanged.',
              '',
              '```json',
              report,
              '```',
              '',
              'Fix the directive (task id / lane) or update the task manually with `furrow move`.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Fail the job if any directive was invalid
        if: steps.gate.outputs.proceed == 'true' && steps.apply.outputs.code != '0'
        run: |
          echo "furrow apply reported invalid directive(s) (exit ${{ steps.apply.outputs.code }})."
          echo "This job is intentionally NON-blocking — keep it out of required checks."
          exit 1

name: Next-version guard
description: >-
  Decide whether to cut a release from (next, last, pub-latest): emits
  release=true/false + version, or fails on a deadlock (next not strictly greater
  than the latest published release). The pure decision half of release.yml's
  version step, extracted so self-test can table-test it. See t-kve5.

inputs:
  next:
    description: "git-cliff --bumped-version (may be empty)."
    required: true
  last:
    description: "Newest local git tag (may be empty)."
    required: false
    default: ""
  pub-latest:
    description: "Newest PUBLISHED release tag vX.Y.Z (may be empty)."
    required: false
    default: ""

outputs:
  release:
    description: "'true' to cut/update the draft, 'false' for no release-worthy changes."
    value: ${{ steps.guard.outputs.release }}
  version:
    description: "The version to release (set only when release=true)."
    value: ${{ steps.guard.outputs.version }}

runs:
  using: composite
  steps:
    - id: guard
      shell: bash
      env:
        NEXT: ${{ inputs.next }}
        LAST: ${{ inputs.last }}
        PUB_LATEST: ${{ inputs.pub-latest }}
      run: bash "$GITHUB_ACTION_PATH/next-version-guard.sh"
